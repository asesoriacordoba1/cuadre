html,body{margin:0;padding:0}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px}
.login-card .brand{padding:0;margin-bottom:4px}
.login-card p.sub{font-size:12.5px;color:var(--ink-soft);margin:4px 0 20px}

function fmtCOP(n){
  n = Math.round(n||0);
  var neg = n<0; n=Math.abs(n);
  var s = n.toLocaleString('es-CO');
  return (neg?"-$ ":"$ ")+s;
}

  if(!iso) return "";
  var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0];
}

function bimestreDePeriodo(per){
  var year=per.slice(0,4), month=parseInt(per.slice(5,7),10);
  var idx=Math.ceil(month/2)-1; if(idx<0) idx=0; if(idx>5) idx=5;

/* ---------- boot / auth ---------- */
function boot(){
  render();
  sb.auth.getSession().then(function(res){
    S.session = res.data.session; S.authChecked = true;
    render();
    if(S.session) afterLogin();
  });
  sb.auth.onAuthStateChange(function(event, session){
    var had = !!S.session;
    S.session = session;
    if(session && !had){ render(); afterLogin(); }
    else if(!session && had){ teardownEmpresa(); S.empresas=[]; S.empresaId=null; clearMainChannels(); render(); }
  });
}
function afterLogin(){
  loadEmpresas();
  subscribeEmpresasRealtime();
  loadConfig();
  var chCfg = sb.channel("config-rt").on("postgres_changes",{event:"*",schema:"public",table:"config"},debounce(function(){ loadConfig().then(render); })).subscribe();
  S.channels.push(chCfg);
  loadReglasCuentas();
  var chReg = sb.channel("reglas-rt").on("postgres_changes",{event:"*",schema:"public",table:"reglas_cuentas"},debounce(function(){ loadReglasCuentas().then(render); })).subscribe();
  S.channels.push(chReg);
}
async function loadConfig(){
  var res = await sb.from("config").select("*").eq("id","global").maybeSingle();
  if(res.error){ console.error(res.error); return; }
  S.config = res.data || {uvt:52374, tasa_compras:2.5, tasa_arrendamientos:3.5, base_minima:524000};
}
async function guardarConfig(uvt, tc, ta, bm){
  await sb.from("config").upsert({id:"global", uvt:uvt, tasa_compras:tc, tasa_arrendamientos:ta, base_minima:bm});
}
function clearMainChannels(){
  S.channels.forEach(function(ch){ sb.removeChannel(ch); });
  S.channels=[];
}
async function doLogin(email,pass){
  S.loginErr="";
  var res = await sb.auth.signInWithPassword({email:email,password:pass});
  if(res.error){ S.loginErr = res.error.message==="Invalid login credentials" ? "Correo o contraseña incorrectos." : res.error.message; render(); return; }
}
function doLogout(){
  sb.auth.signOut();
}

/* ---------- empresas ---------- */
async function loadEmpresas(){
  var res = await sb.from("empresas").select("*").order("nombre");
  if(res.error){ console.error(res.error); return; }
  S.empresas = res.data || [];
  if(!S.empresaId && S.empresas.length){ selectEmpresa(S.empresas[0].id); }
  else if(S.empresaId && !S.empresas.some(function(e){return e.id===S.empresaId;})){
    S.empresaId = S.empresas.length?S.empresas[0].id:null;
    if(S.empresaId) selectEmpresa(S.empresaId); else { teardownEmpresa(); render(); }
  } else render();
}
function subscribeEmpresasRealtime(){
  var ch = sb.channel("empresas-rt").on("postgres_changes",{event:"*",schema:"public",table:"empresas"},function(){ loadEmpresas(); }).subscribe();
  S.channels.push(ch);
}

function teardownEmpresa(){
  S.empresaChannels.forEach(function(ch){ sb.removeChannel(ch); });
  S.empresaChannels=[];
  S.cuentas=[]; S.terceros=[]; S.comprobantes=[]; S.periodosDocs={};
}

async function selectEmpresa(id){
  if(S.empresaId===id && S.cuentas.length){ render(); return; }
  S.empresaId = id;
  teardownEmpresa();
  render();
  if(!id) return;
  await Promise.all([loadCuentas(id), loadTerceros(id), loadComprobantes(id), loadPeriodos(id)]);
  render();
  var chC = sb.channel("cuentas-"+id).on("postgres_changes",{event:"*",schema:"public",table:"cuentas",filter:"empresa_id=eq."+id},debounce(function(){ loadCuentas(id).then(render); })).subscribe();
  var chT = sb.channel("terceros-"+id).on("postgres_changes",{event:"*",schema:"public",table:"terceros",filter:"empresa_id=eq."+id},debounce(function(){ loadTerceros(id).then(render); })).subscribe();
  var chP = sb.channel("comprobantes-"+id).on("postgres_changes",{event:"*",schema:"public",table:"comprobantes",filter:"empresa_id=eq."+id},debounce(function(){ loadComprobantes(id).then(render); })).subscribe();
  var chD = sb.channel("periodos-"+id).on("postgres_changes",{event:"*",schema:"public",table:"periodos",filter:"empresa_id=eq."+id},debounce(function(){ loadPeriodos(id).then(render); })).subscribe();
  S.empresaChannels = [chC,chT,chP,chD];
}
async function loadReglasCuentas(){
  S.reglasCuentas = await loadAllRows("reglas_cuentas", null, true);
}
async function loadAllRows(table, id, global){
  var pageSize=1000;
  function q(){ var b=sb.from(table).select("*",{count:"exact"}); return global?b:b.eq("empresa_id",id); }
  function qPage(){ var b=sb.from(table).select("*"); return global?b:b.eq("empresa_id",id); }
  var first = await q().range(0, pageSize-1);
  if(first.error){ console.error(first.error); return []; }
  var all = first.data||[];
  var total = first.count==null ? all.length : first.count;
  var pages = Math.ceil(total/pageSize);
  if(pages>1){
    var reqs=[];
    for(var p=1;p<pages;p++){
      reqs.push(qPage().range(p*pageSize, p*pageSize+pageSize-1));
    }
    var results = await Promise.all(reqs);
    results.forEach(function(res){
      if(res.error) console.error(res.error);
      else all = all.concat(res.data||[]);
    });
  }
  return all;
}
async function loadCuentas(id){
  var data = await loadAllRows("cuentas", id);
  var list = data.map(function(r){ r._id=r.codigo; return r; });
  list.sort(function(a,b){ return a.codigo.localeCompare(b.codigo); });
  S.cuentas = list;
}
async function loadTerceros(id){
  var data = await loadAllRows("terceros", id);
  var list = data.map(function(r){ r._id=r.id; return r; });
  list.sort(function(a,b){ return (a.nombre||"").localeCompare(b.nombre||""); });
  S.terceros = list;
}
async function loadComprobantes(id){
  var data = await loadAllRows("comprobantes", id);
  var list = data.map(function(r){ r._id=r.numero; return r; });
  list.sort(function(a,b){ if(a.fecha!==b.fecha) return a.fecha<b.fecha?-1:1; return (a._id||"").localeCompare(b._id||""); });
  S.comprobantes = list;
  if(!S.periodo){ var ps=distinctPeriodos(); S.periodo = ps.length?ps[ps.length-1]:todayPeriodo(); }
}
async function loadPeriodos(id){
  var data = await loadAllRows("periodos", id);
  var map={}; data.forEach(function(r){ map[r.periodo]=r; });
  S.periodosDocs = map;
}

function distinctPeriodos(){
  var set={};
  S.comprobantes.forEach(function(c){ if(c.periodo) set[c.periodo]=1; });
  set[todayPeriodo()]=1;
  return Object.keys(set).sort();
}
function currentEmpresa(){ return S.empresas.find(function(e){return e.id===S.empresaId;}); }
function cuentaByCodigo(c){ return S.cuentas.find(function(x){return x.codigo===c;}); }
function terceroById(id){ return S.terceros.find(function(t){return t.id===id;}); }

async function crearEmpresa(nombre, nit, sector, grupo){
  var ins = await sb.from("empresas").insert({nombre:nombre, nit:nit, sector:sector, grupo_niif:grupo, creada:todayISO(), demo:false}).select().single();
  if(ins.error){ alert("No se pudo crear la empresa: "+ins.error.message); return; }
  var id = ins.data.id;
  var rows = PUC.map(function(row){ return {empresa_id:id, codigo:row[0], nombre:row[1], tipo:row[2], nivel:row[3], naturaleza:naturaleza(row[2],!!row[4]), postable:esPostable(row[0])}; });
  var pucCodigos = {}; rows.forEach(function(r){ pucCodigos[r.codigo]=true; });
  S.reglasCuentas.forEach(function(r){
    if(!r.cuenta_codigo || pucCodigos[r.cuenta_codigo]) return;
    pucCodigos[r.cuenta_codigo]=true;
    var tipo = tipoDesdeCodigo(r.cuenta_codigo);
    rows.push({empresa_id:id, codigo:r.cuenta_codigo, nombre:r.cuenta_nombre||r.cuenta_codigo, tipo:tipo, nivel:r.cuenta_codigo.length>=6?2:1, naturaleza:naturaleza(tipo,false), postable:true});
  });
  await sb.from("cuentas").insert(rows);
  closeModal();
  selectEmpresa(id);
}

/* ---------- comprobantes ---------- */
function totalsOf(lineas){
  var d=0,c=0;
  lineas.forEach(function(l){ d+=Number(l.debito)||0; c+=Number(l.credito)||0; });
  return {d:d,c:c};
}
function nextNumero(prefix, periodo){
  var max=0;
  S.comprobantes.forEach(function(c){
    if(c.tipo===prefix && c.periodo===periodo){
      var n=parseInt((c._id||"").split("-").pop(),10);
      if(n>max) max=n;
    }
  });
  return prefix+"-"+periodo+"-"+String(max+1).padStart(4,"0");
}
function periodoCerrado(p){ return S.periodosDocs[p] && S.periodosDocs[p].estado==="cerrado"; }

async function guardarComprobante(data){
  var tot=totalsOf(data.lineas);
  if(Math.abs(tot.d-tot.c)>0.5 || tot.d===0){ alert("El comprobante debe cuadrar (débitos = créditos) antes de guardarlo."); return; }
  if(periodoCerrado(data.periodo)){ alert("Ese periodo ya está cerrado. Reábrelo desde Periodos para poder modificarlo."); return; }
  var numero = data._id || nextNumero(data.tipo, data.periodo);
  var row = {
    empresa_id:S.empresaId, numero:numero, tipo:data.tipo, fecha:data.fecha, periodo:data.periodo, descripcion:data.descripcion,
    lineas:data.lineas, total_debito:tot.d, total_credito:tot.c, estado:"contabilizado"
  };
  var res = await sb.from("comprobantes").upsert(row,{onConflict:"empresa_id,numero"});
  if(res.error){ alert("No se pudo guardar: "+res.error.message); return; }
  closeModal();
}
var TASA_COSTO_VENTA = 80;
function generarCostoVenta(per){
  if(periodoCerrado(per)){ alert("No puedes generar comprobantes en un periodo cerrado."); return; }
  var yaExiste = S.comprobantes.some(function(c){ return c.periodo===per && c.tipo==="CV"; });
  if(yaExiste && !confirm("Ya existe un comprobante de Costo de Venta para "+periodoLabel(per)+". ¿Generar uno nuevo de todas formas? (el anterior no se elimina solo)")) return;

  var gravadaNeta=0, exentaNeta=0;
  S.comprobantes.forEach(function(c){
    if(c.periodo!==per || c.tipo!=="FV") return;
    var esDevol = /^Nota Crédito/.test(c.descripcion||"");
    var s = gravadaExentaDe(ivaMainDe(c));
    if(esDevol){ gravadaNeta -= s.gravada; exentaNeta -= s.exenta; }
    else { gravadaNeta += s.gravada; exentaNeta += s.exenta; }
  });
  var totalBase = gravadaNeta+exentaNeta;
  if(totalBase<=0){ alert("No hay ventas netas en "+periodoLabel(per)+" para calcular el costo de venta."); return; }
  var costoTotal = Math.round(totalBase * TASA_COSTO_VENTA / 100);
  var costoGravada = Math.round(costoTotal * gravadaNeta/totalBase);
  var costoExenta = costoTotal - costoGravada;
  var lineas = [{cuenta:"613501", tercero:"", detalle:"Costo de venta "+TASA_COSTO_VENTA+"% - "+periodoLabel(per), debito:costoTotal, credito:0}];
  if(costoGravada>0) lineas.push({cuenta:"143501", tercero:"", detalle:"Costo de venta - mercancía gravada 19%", debito:0, credito:costoGravada});
  if(costoExenta>0) lineas.push({cuenta:"143590", tercero:"", detalle:"Costo de venta - mercancía exenta/excluida", debito:0, credito:costoExenta});
  guardarComprobante({tipo:"CV", fecha: per+"-01", periodo:per, descripcion:"Costo de venta ("+TASA_COSTO_VENTA+"%) - "+periodoLabel(per), lineas:lineas});
}
async function eliminarComprobante(numero){
  var c = S.comprobantes.find(function(x){return x._id===numero;});
  if(c && periodoCerrado(c.periodo)){ alert("No puedes eliminar comprobantes de un periodo cerrado."); return; }
  if(!confirm("¿Eliminar el comprobante "+numero+"? Esta acción no se puede deshacer.")) return;
  await sb.from("comprobantes").delete().eq("empresa_id",S.empresaId).eq("numero",numero);
}
async function eliminarComprobantesPeriodoTipo(per, tipo){
  if(periodoCerrado(per)){ alert("No puedes eliminar comprobantes de un periodo cerrado."); return; }
  var lista = S.comprobantes.filter(function(c){return c.periodo===per && c.tipo===tipo;});
  if(!lista.length) return;
  var tipoLbl = (COMPROB_TIPOS.find(function(t){return t.k===tipo;})||{}).label||tipo;
  if(!confirm("¿Eliminar los "+lista.length+" comprobantes de \""+tipoLbl+"\" de "+periodoLabel(per)+"? Esta acción no se puede deshacer. Útil para volver a importar el período tras una corrección del sistema.")) return;
  S.bulkDeleteBusy=true; render();
  var numeros = lista.map(function(c){return c._id;});
  for(var i=0;i<numeros.length;i+=100){
    var batch = numeros.slice(i,i+100);
    await sb.from("comprobantes").delete().eq("empresa_id",S.empresaId).in("numero",batch);
  }
  S.bulkDeleteBusy=false; render();
}

/* ---------- importador DIAN ---------- */
function normDigits(s){ return String(s||"").replace(/\D/g,""); }
function nitMatches(a,b){
  var x=normDigits(a), y=normDigits(b);
  if(!x||!y) return false;
  if(x===y) return true;
  if(Math.abs(x.length-y.length)===1){
    var longer = x.length>y.length?x:y, shorter=x.length>y.length?y:x;
    return longer.slice(0,shorter.length)===shorter;
  }
  return false;
}
function excelDateToISO(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  return null;
}
function slotDeCuenta(codigo){
  var c4 = codigo.slice(0,4);
  if(c4==="1305") return "receivable";
  if(c4==="1355") return "retFavor";
  if(c4==="2205") return "payable";
  if(c4==="2365") return "reteRenta";
  if(c4==="2367") return "reteIva";
  if(c4==="2368") return "reteIca";
  if(c4==="2408") return "iva";
  var c1 = codigo[0];
  if(c1==="4"||c1==="5"||c1==="6") return /590$/.test(codigo) ? "mainExenta" : "mainGravada";
  return "otro";
}
function buildDraftFromDianRow(row, empresa, proveedores, terceros, config, reglas){
  var tipoDocRaw = String(row["Tipo de documento"]||"");
  var esNC = /cr[eé]dito/i.test(tipoDocRaw);
  var esND = !esNC && /d[eé]bito/i.test(tipoDocRaw);
  var esVenta = nitMatches(row["NIT Emisor"], empresa.nit);
  var esCompra = !esVenta && nitMatches(row["NIT Receptor"], empresa.nit);
  if(!esVenta && !esCompra) return null;

  var total = Number(row["Total"])||0;
  if(total<=0) return null;
  var iva = Number(row["IVA"])||0;
  var reteIva = Number(row["Rete IVA"])||0;
  var reteRenta = Number(row["Rete Renta"])||0;
  var reteIca = Number(row["Rete ICA"])||0;
  var fecha = excelDateToISO(row["Fecha Emisión"]);
  if(!fecha) return {_error:"fecha", raw: row["Fecha Emisión"]};
  var cufe = row["CUFE/CUDE"]||"";
  var tercNombre = esVenta ? (row["Nombre Receptor"]||"") : (row["Nombre Emisor"]||"");
  var docRef = (row["Prefijo"]||"")+""+(row["Folio"]||"");

  var retNota = "";
  var tMatch = (terceros||[]).find(function(t){ return nitMatches(esVenta?row["NIT Receptor"]:row["NIT Emisor"], t.identificacion); });
  if(esCompra && tMatch && config){
    if(tMatch.autorretenedor){ reteRenta = 0; retNota = " (O-15/O-47, sin retención)"; }
    else if(tMatch.concepto_retencion==="compras" || tMatch.concepto_retencion==="arrendamientos"){
      var base = total - iva;
      var tasa = tMatch.concepto_retencion==="compras" ? config.tasa_compras : config.tasa_arrendamientos;
      reteRenta = base >= config.base_minima ? Math.round(base * tasa / 100) : 0;
      retNota = " ("+tMatch.concepto_retencion+" "+tasa+"%)";
    }
    else if(CONCEPTOS_SIN_RETENCION.indexOf(tMatch.concepto_retencion)>=0){ reteRenta = 0; }
  }

  function splitGravadaExenta(){
    var baseGravada = iva>0 ? (iva/19*100) : 0;
    var baseExenta = total - iva - baseGravada;
    if(baseExenta<0){ baseGravada = total-iva; baseExenta = 0; }
    else if(Math.abs(baseExenta)<1) baseExenta=0;
    return {gravada:baseGravada, exenta:baseExenta};
  }

  var lineas=[];
  if(esVenta){
    var reten = reteIva+reteRenta+reteIca;
    lineas.push({cuenta:"1305", tercero:"", detalle:"Cliente "+tercNombre+" - "+docRef, debito: total-reten, credito:0});
    if(reten>0) lineas.push({cuenta:"1355", tercero:"", detalle:"Retenciones practicadas por "+tercNombre, debito:reten, credito:0});
    var conceptoIngreso = tMatch && INGRESO_LABELS[tMatch.concepto_ingreso];
    if(tMatch && tMatch.concepto_ingreso==="semovientes"){
      lineas.push({cuenta:"413518", tercero:"", detalle:"Venta de animales vivos y cueros "+tercNombre+" - "+docRef, debito:0, credito: total-iva});
    } else if(tMatch && tMatch.concepto_ingreso==="arriendo"){
      lineas.push({cuenta:"424525", tercero:"", detalle:"Ingresos por arrendamientos "+tercNombre+" - "+docRef, debito:0, credito: total-iva});
    } else if(conceptoIngreso){
      lineas.push({cuenta:"4295", tercero:"", detalle:"Ingreso "+conceptoIngreso+" "+tercNombre+" - "+docRef+" (verificar cuenta)", debito:0, credito: total-iva});
    } else {
      var baseV = splitGravadaExenta();
      if(baseV.gravada>0) lineas.push({cuenta:"413501", tercero:"", detalle:"Venta gravada 19% "+docRef, debito:0, credito: baseV.gravada});
      if(baseV.exenta>0) lineas.push({cuenta:"413590", tercero:"", detalle:"Venta exenta/excluida "+docRef, debito:0, credito: baseV.exenta});
      if(baseV.gravada<=0 && baseV.exenta<=0) lineas.push({cuenta:"4135", tercero:"", detalle:"Venta "+docRef, debito:0, credito: total-iva});
    }
    if(iva>0) lineas.push({cuenta:"2408", tercero:"", detalle:"IVA generado", debito:0, credito:iva});
  } else {
    var conceptoGasto = tMatch && CONCEPTO_LABELS[tMatch.concepto_retencion];
    var esMercancia = tMatch && tMatch.tipo==="proveedor" && !conceptoGasto;
    if(esMercancia){
      var baseC = splitGravadaExenta();
      if(baseC.gravada>0) lineas.push({cuenta:"143501", tercero:"", detalle:"Mercancía gravada 19% "+tercNombre+" - "+docRef, debito: baseC.gravada, credito:0});
      if(baseC.exenta>0) lineas.push({cuenta:"143590", tercero:"", detalle:"Mercancía exenta/excluida "+tercNombre+" - "+docRef, debito: baseC.exenta, credito:0});
      if(baseC.gravada<=0 && baseC.exenta<=0) lineas.push({cuenta:"1435", tercero:"", detalle:"Mercancías "+tercNombre+" - "+docRef, debito: total-iva, credito:0});
    } else if(tMatch && tMatch.concepto_retencion==="fletes"){
      lineas.push({cuenta:"513551", tercero:"", detalle:"Fletes y transporte "+tercNombre+" - "+docRef, debito: total-iva, credito:0});
    } else if(tMatch && tMatch.concepto_retencion==="servicios_publicos"){
      lineas.push({cuenta:"513540", tercero:"", detalle:"Servicios públicos "+tercNombre+" - "+docRef, debito: total-iva, credito:0});
    } else if(conceptoGasto){
      lineas.push({cuenta:"5195", tercero:"", detalle:"Gasto "+conceptoGasto+" "+tercNombre+" - "+docRef+" (verificar cuenta)", debito: total-iva, credito:0});
    } else {
      lineas.push({cuenta:"5195", tercero:"", detalle:"Compra "+tercNombre+" - "+docRef+" (verificar cuenta)", debito: total-iva, credito:0});
    }
    if(iva>0) lineas.push({cuenta:"2408", tercero:"", detalle:"IVA descontable", debito:iva, credito:0});
    var pagoProveedor = total-reteIva-reteRenta-reteIca;
    lineas.push({cuenta:"2205", tercero:"", detalle:"Proveedor "+tercNombre+" - "+docRef, debito:0, credito:pagoProveedor});
    if(reteRenta>0) lineas.push({cuenta:"2365", tercero:"", detalle:"Retención en la fuente"+retNota, debito:0, credito:reteRenta});
    if(reteIva>0) lineas.push({cuenta:"2367", tercero:"", detalle:"Reteiva", debito:0, credito:reteIva});
    if(reteIca>0) lineas.push({cuenta:"2368", tercero:"", detalle:"Rete ICA", debito:0, credito:reteIca});
  }

  var porReglas = false;
  if(reglas && reglas.length){
    var documentoKey = esVenta ?
      (esNC ? "Devolucion en Ventas" : ((tMatch && INGRESO_DOC_KEYS[tMatch.concepto_ingreso]) || "Factura de Venta")) :
      (esNC ? "Devolucion en Compras" : ((tMatch && CONCEPTO_DOC_KEYS[tMatch.concepto_retencion]) || "Factura de Compra"));
    var regimenBuscado = tMatch?tMatch.regimen:"";
    var matches = reglas.filter(function(r){ return r.documento===documentoKey; });
    var exact = regimenBuscado ? matches.filter(function(r){ return r.regimen===regimenBuscado; }) : [];
    var aplicables = exact.length ? exact : matches.filter(function(r){ return !r.regimen; });
    var porSlot = {};
    aplicables.forEach(function(r){
      var slot = slotDeCuenta(r.cuenta_codigo);
      if(slot==="otro") return;
      (porSlot[slot]=porSlot[slot]||[]).push(r);
    });
    Object.keys(porSlot).forEach(function(slot){
      var candidatos = porSlot[slot];
      var elegido = candidatos[0];
      if(candidatos.length>1){
        var esGravada = iva>0;
        var pref = candidatos.find(function(r){
          var n=(r.cuenta_nombre||"").toUpperCase();
          return esGravada ? /GRAVAD/.test(n) : /(EXENT|EXCLUI)/.test(n);
        });
        if(pref) elegido = pref;
      }
      var idx = lineas.findIndex(function(l){ return slotDeCuenta(l.cuenta)===slot; });
      if(idx>=0){
        lineas[idx] = {cuenta:elegido.cuenta_codigo, tercero:"", detalle:elegido.cuenta_nombre||lineas[idx].detalle, debito:lineas[idx].debito, credito:lineas[idx].credito};
        porReglas = true;
      }
    });
  }

  var esContado = String(row["Forma de Pago"]||"").trim()==="1";
  if(esContado){
    lineas = lineas.map(function(l){
      if(l.cuenta.slice(0,4)==="1305" || l.cuenta.slice(0,4)==="2205"){
        return {cuenta:"110505", tercero:"", detalle:l.detalle+" (contado)", debito:l.debito, credito:l.credito};
      }
      return l;
    });
  }
  if(esNC){ lineas = lineas.map(function(l){ return {cuenta:l.cuenta, tercero:l.tercero, detalle:"(NC) "+l.detalle, debito:l.credito, credito:l.debito}; }); }

  var esPersonal = false, esConocidoPersonal = false;
  if(esCompra){
    esConocidoPersonal = !!(tMatch && tMatch.tipo==="personal");
    esPersonal = !esMercancia;
  }
  var etiqueta = esConocidoPersonal ? " [personal]" : (esPersonal ? " [diverso]" : "");

  var tot = totalsOf(lineas);
  return {
    tipo: esVenta? "FV":"FC",
    fecha: fecha,
    descripcion: (esNC?"Nota Crédito - ":(esND?"Nota Débito - ":(esVenta?"Venta - ":"Compra - ")))+tercNombre+" ("+docRef+")"+etiqueta,
    lineas: lineas,
    cufe: cufe,
    tercNombre: tercNombre,
    total: total,
    esVenta: esVenta,
    esNC: esNC,
    esND: esND,
    esPersonal: esPersonal,
    esConocidoPersonal: esConocidoPersonal,
    porReglas: porReglas,
    debeCuadra: Math.abs(tot.d-tot.c)<1
  };
}
function handleImportFile(file){
  S.importBusy=true; S.importErr=""; S.importRows=null; render();
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:"array", cellDates:true});
      var sheetName = wb.SheetNames.find(function(n){return /^Rp_Doc/i.test(n);}) || wb.SheetNames[0];
      var ws = wb.Sheets[sheetName];
      var json = XLSX.utils.sheet_to_json(ws, {defval:""});
      var empresa = currentEmpresa();
      var existingCufes = {}; S.comprobantes.forEach(function(c){ if(c.cufe) existingCufes[c.cufe]=true; });
      var seenInFile = {};
      var drafts=[];
      var skippedFecha=0, sampleFecha=null;
      var proveedores = S.terceros.filter(function(t){ return t.tipo==="proveedor" && t.identificacion; });
      json.forEach(function(row){
        var estado = String(row["Estado"]||"").toLowerCase();
        if(estado.indexOf("rechaz")>=0 || estado.indexOf("anulad")>=0) return;
        var d = buildDraftFromDianRow(row, empresa, proveedores, S.terceros, S.config, S.reglasCuentas);
        if(!d) return;
        if(d._error==="fecha"){ skippedFecha++; if(sampleFecha==null) sampleFecha=d.raw; return; }
        d.dup = !!(d.cufe && (existingCufes[d.cufe] || seenInFile[d.cufe]));
        if(d.cufe) seenInFile[d.cufe]=true;
        d.include = !d.dup && !d.esConocidoPersonal;
        drafts.push(d);
      });
      S.importRows = drafts;
      S.importFileName = file.name;
      if(!drafts.length && !skippedFecha) S.importErr = "No se encontraron documentos de esta empresa en el archivo. Verifica que el NIT de la empresa esté bien escrito en Cuadre.";
      else if(skippedFecha>0) S.importErr = skippedFecha+" documento(s) no se pudieron importar porque no se entendió su fecha (ejemplo: "+esc(String(sampleFecha))+"). Avísale a Claude este formato para corregirlo.";
    }catch(err){
      S.importErr = "No se pudo leer el archivo: "+err.message;
    }
    S.importBusy=false; render();
  };
  reader.onerror=function(){ S.importErr="No se pudo leer el archivo."; S.importBusy=false; render(); };
  reader.readAsArrayBuffer(file);
}
async function confirmImport(){
  var rows = (S.importRows||[]).filter(function(r){return r.include && r.debeCuadra;});
  if(!rows.length){ alert("No hay filas seleccionadas para importar."); return; }
  S.importBusy=true; render();
  var counters={};
  function nextNum(tipo,periodo){
    var key=tipo+"|"+periodo;
    if(counters[key]==null){
      var max=0;
      S.comprobantes.forEach(function(c){ if(c.tipo===tipo && c.periodo===periodo){ var n=parseInt((c._id||"").split("-").pop(),10); if(n>max) max=n; } });
      counters[key]=max;
    }
    counters[key]++;
    return tipo+"-"+periodo+"-"+String(counters[key]).padStart(4,"0");
  }
  var toInsert = rows.map(function(r){
    var periodo = r.fecha.slice(0,7);
    var numero = nextNum(r.tipo, periodo);
    var tot = totalsOf(r.lineas);
    return {empresa_id:S.empresaId, numero:numero, tipo:r.tipo, fecha:r.fecha, periodo:periodo, descripcion:r.descripcion, lineas:r.lineas, total_debito:tot.d, total_credito:tot.c, estado:"contabilizado", cufe:r.cufe||null};
  });
  var CHUNK=500, done=0;
  for(var i=0;i<toInsert.length;i+=CHUNK){
    var batch = toInsert.slice(i, i+CHUNK);
    var res = await sb.from("comprobantes").insert(batch);
    if(res.error){
      S.importBusy=false; render();
      alert("Se importaron "+done+" de "+toInsert.length+" antes de un error: "+res.error.message+". Los ya importados quedaron guardados; puedes reintentar con el resto más tarde.");
      return;
    }
    batch.forEach(function(row){ var r=Object.assign({},row); r._id=r.numero; S.comprobantes.push(r); });
    done += batch.length;
    S.importProgress = {done:done, total:toInsert.length};
    render();
  }
  S.importBusy=false; S.importProgress=null;
  var n=toInsert.length;
  S.importRows=null; S.importFileName="";
  render();
  alert("Se importaron "+n+" comprobantes. Revísalos en la pestaña Comprobantes (las compras traen una cuenta de gasto genérica que puedes reclasificar).");
}

/* ---------- limpieza de compras ya importadas ---------- */
function extractTercFromDescripcion(desc){
  var s = String(desc||"");
  s = s.replace(/^(Compra|Venta|Nota Crédito|Nota Débito) - /, "");
  s = s.replace(/\s*\([^)]*\)\s*$/, "");
  s = s.replace(/\s*\[(personal|diverso)\]\s*$/, "");
  return s.trim();
}
function analizarCompras(){
  var map = {};
  S.comprobantes.forEach(function(c){
    if(c.tipo!=="FC") return;
    var nombre = extractTercFromDescripcion(c.descripcion) || "(sin nombre)";
    if(!map[nombre]) map[nombre] = {nombre:nombre, numeros:[], total:0, checked:false};
    map[nombre].numeros.push(c._id);
    map[nombre].total += c.total_debito||0;
  });
  var groups = Object.keys(map).map(function(k){return map[k];});
  groups.sort(function(a,b){return b.total-a.total;});
  S.cleanupGroups = groups;
  render();
}
async function eliminarGruposSeleccionados(){
  var sel = (S.cleanupGroups||[]).filter(function(g){return g.checked;});
  if(!sel.length) return;
  var totalNum = sel.reduce(function(a,g){return a+g.numeros.length;},0);
  var totalVal = sel.reduce(function(a,g){return a+g.total;},0);
  if(!confirm("¿Eliminar "+totalNum+" comprobantes ("+fmtCOP(totalVal)+") de "+sel.length+" proveedor(es)? Esta acción no se puede deshacer.")) return;
  S.cleanupBusy=true; render();
  var allNumeros = [];
  sel.forEach(function(g){ g.numeros.forEach(function(n){
    var c = S.comprobantes.find(function(x){return x._id===n;});
    if(c && !periodoCerrado(c.periodo)) allNumeros.push(n);
  }); });
  var CHUNK=200;
  for(var i=0;i<allNumeros.length;i+=CHUNK){
    var batch = allNumeros.slice(i,i+CHUNK);
    var res = await sb.from("comprobantes").delete().eq("empresa_id",S.empresaId).in("numero",batch);
    if(res.error){
      S.cleanupBusy=false; render();
      alert("Error eliminando: "+res.error.message);
      return;
    }
    S.comprobantes = S.comprobantes.filter(function(c){return batch.indexOf(c._id)<0;});
    render();
  }
  S.cleanupBusy=false; S.cleanupGroups=null;
  render();
  alert("Se eliminaron "+allNumeros.length+" comprobantes.");
}

/* ---------- saldos engine ---------- */
function computeSaldos(hastaPeriodo){
  var saldos={};
  S.cuentas.forEach(function(c){ saldos[c.codigo]={d:0,c:0}; });
  S.comprobantes.forEach(function(cp){
    if(!cp.periodo || cp.periodo>hastaPeriodo) return;
    if(cp.periodo.slice(0,4)!==hastaPeriodo.slice(0,4)) return;
    (cp.lineas||[]).forEach(function(l){
      if(!saldos[l.cuenta]) saldos[l.cuenta]={d:0,c:0};
      saldos[l.cuenta].d += Number(l.debito)||0;
      saldos[l.cuenta].c += Number(l.credito)||0;
    });
  });
  return saldos;
}
function movimientosPeriodo(periodo){
  var mov={};
  S.cuentas.forEach(function(c){ mov[c.codigo]={d:0,c:0}; });
  S.comprobantes.forEach(function(cp){
    if(cp.periodo!==periodo) return;
    (cp.lineas||[]).forEach(function(l){
      if(!mov[l.cuenta]) mov[l.cuenta]={d:0,c:0};
      mov[l.cuenta].d += Number(l.debito)||0;
      mov[l.cuenta].c += Number(l.credito)||0;
    });
  });
  return mov;
}
function saldoNeto(codigo, sums){
  var s=sums[codigo]||{d:0,c:0};
  var ac=cuentaByCodigo(codigo);
  var nat = ac?ac.naturaleza:"debito";
  return nat==="debito" ? (s.d-s.c) : (s.c-s.d);
}
function utilidadAcumulada(hastaPeriodo){
  var sums=computeSaldos(hastaPeriodo);
  var ing=0,gas=0,cos=0;
  S.cuentas.forEach(function(c){
    if(!esPostable(c.codigo)) return;
    var n=saldoNeto(c.codigo,sums);
    if(c.tipo==="ingreso") ing+=n;
    else if(c.tipo==="gasto") gas+=n;
    else if(c.tipo==="costo") cos+=n;
  });
  return {ingresos:ing, gastos:gas, costos:cos, utilidad: ing-gas-cos};
}

function categoriaComprobante(c){
  var desc = c.descripcion||"";
  if(/^Nota Crédito/.test(desc)) return "nc";
  if(/^Nota Débito/.test(desc)) return "nd";
  if(c.tipo==="NM") return "nomina";
  if(c.tipo==="FV") return "fv";
  if(c.tipo==="FC"){
    var esMercancia = (c.lineas||[]).some(function(l){ return (l.cuenta||"").slice(0,2)==="14"; });
    return esMercancia ? "fc" : "gastos";
  }
  return "otro";
}

function comprobanteMensualHTML(per){
  var list = S.comprobantes.filter(function(c){return c.periodo===per;});
  if(!list.length) return '<div class="card card-pad"><p class="small">Sin comprobantes en '+periodoLabel(per)+'.</p></div>';
  var DEVOL_LABELS = {FV:"Devolución en Ventas", FC:"Devolución en Compras"};
  var SPLIT_CODES = { FV:{gravada:"413501", exenta:"413590"}, FC:{gravada:"143501", exenta:"143590"} };
  var bloques={};
  var agg={};
  list.forEach(function(c){
    var esDevol = /^Nota Crédito/.test(c.descripcion||"") && DEVOL_LABELS[c.tipo];
    var key = esDevol ? (c.tipo+"_NC") : c.tipo;
    if(!bloques[key]) bloques[key]={};
    var sc = SPLIT_CODES[c.tipo];
    var ivaDoc = 0, tieneMain = false;
    (c.lineas||[]).forEach(function(l){
      var cuenta = l.cuenta||"";
      if(cuenta.slice(0,4)==="2408") ivaDoc += (Number(l.debito)||0)+(Number(l.credito)||0);
      if(sc){
        var esMain = c.tipo==="FV" ? cuenta[0]==="4" : cuenta.slice(0,2)==="14";
        if(esMain){ tieneMain = true; return; }
      }
      if(!bloques[key][cuenta]) bloques[key][cuenta]={d:0,c:0};
      bloques[key][cuenta].d += Number(l.debito)||0;
      bloques[key][cuenta].c += Number(l.credito)||0;
    });
    if(sc && tieneMain){
      if(!agg[key]) agg[key]={iva:0, main:0};
      var total = c.tipo==="FV" ? (Number(c.total_debito)||0) : (Number(c.total_credito)||0);
      agg[key].iva += ivaDoc;
      agg[key].main += (total - ivaDoc);
    }
  });
  Object.keys(agg).forEach(function(key){
    var tipoBase = key.replace(/_NC$/,"");
    var sc = SPLIT_CODES[tipoBase];
    var a = agg[key];
    if(a.main===0) return;
    var gravada = a.iva>0 ? (a.iva/19*100) : 0;
    var exenta = a.main - gravada;
    var isDevolKey = /_NC$/.test(key);
    var lado = tipoBase==="FV" ? (isDevolKey?"d":"c") : (isDevolKey?"c":"d");
    if(!bloques[key][sc.gravada]) bloques[key][sc.gravada]={d:0,c:0};
    if(!bloques[key][sc.exenta]) bloques[key][sc.exenta]={d:0,c:0};
    bloques[key][sc.gravada][lado] += gravada;
    bloques[key][sc.exenta][lado] += exenta;
  });
  var orden = ["FV","FV_NC","FC","FC_NC","RC","CE","NC","NM"];
  var claves = Object.keys(bloques).sort(function(a,b){
    var ia=orden.indexOf(a), ib=orden.indexOf(b);
    if(ia<0) ia=99; if(ib<0) ib=99;
    return ia-ib;
  });
  var totD=0, totC=0;
  var html = '<div class="card card-pad"><div class="section-title">Comprobante consolidado — '+periodoLabel(per)+'</div>';
  claves.forEach(function(k){
    var tipoBase = k.replace(/_NC$/,"");
    var tipoLbl = /_NC$/.test(k) ? DEVOL_LABELS[tipoBase] : ((COMPROB_TIPOS.find(function(t){return t.k===k;})||{}).label || k);
    var codigos = Object.keys(bloques[k]).sort();
    var subD=0, subC=0;
    var filas = codigos.map(function(cod){
      var s = bloques[k][cod];
      subD+=s.d; subC+=s.c;
      var ac = cuentaByCodigo(cod);
      return '<tr><td class="mono acct-code">'+cod+'</td><td>'+esc(ac?ac.nombre:"")+'</td><td class="num">'+(s.d?fmtCOP(s.d):"")+'</td><td class="num">'+(s.c?fmtCOP(s.c):"")+'</td></tr>';
    }).join("");
    totD+=subD; totC+=subC;
    html += '<div class="small" style="font-weight:600;margin:16px 0 6px">'+tipoLbl+'</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th>Cuenta</th><th>Nombre</th><th class="num">Débito</th><th class="num">Crédito</th></tr></thead><tbody>'+filas+
      '<tr class="total-row"><td colspan="2">Subtotal</td><td class="num">'+fmtCOP(subD)+'</td><td class="num">'+fmtCOP(subC)+'</td></tr></tbody></table></div>';
  });
  var cuadra = Math.abs(totD-totC)<1;
  html += '<div class="kpi-grid" style="margin-top:18px">' +
    '<div class="card kpi"><div class="lbl">Total débito</div><div class="val">'+fmtCOP(totD)+'</div></div>' +
    '<div class="card kpi"><div class="lbl">Total crédito</div><div class="val">'+fmtCOP(totC)+'</div></div>' +
    '<div class="card kpi"><div class="lbl">Cuadre</div><div class="val">'+(cuadra?'<span class="chip chip-good"><span class="chip-dot"></span>Cuadra</span>':'<span class="chip chip-bad"><span class="chip-dot"></span>No cuadra</span>')+'</div></div>' +
  '</div></div>';
  return html;
}

function ivaMainDe(c){
  var iva=0;
  (c.lineas||[]).forEach(function(l){
    if((l.cuenta||"").slice(0,4)==="2408") iva += (Number(l.debito)||0) + (Number(l.credito)||0);
  });
  var total = c.tipo==="FV" ? (Number(c.total_debito)||0) : (Number(c.total_credito)||0);
  return {iva:iva, main: total-iva};
}
function gravadaExentaDe(agg){
  var gravada = agg.iva>0 ? (agg.iva/19*100) : 0;
  var exenta = agg.main - gravada;
  if(exenta<0){ gravada = agg.main; exenta = 0; }
  else if(Math.abs(exenta)<1) exenta=0;
  return {gravada:gravada, exenta:exenta};
}
function formulario300HTML(per){

  var c42=vDs.gravada+vDs.exenta;

      filaFormHTML(42,"Devoluciones en ventas anuladas, rescindidas o resueltas",c42) +
      filaFormHTML(43,"Total ingresos netos recibidos durante el período",c43) +
      filaFormHTML(67,"Total impuesto generado por operaciones gravadas",c67) +
    '</tbody></table></div>' +
    '<div class="small" style="font-weight:600;margin:16px 0 6px">COMPRAS (mercancía — excluye compras marcadas como Diverso, sin clasificar)</div>' +
    '<div class="table-wrap"><table class="data"><thead><tr><th>Concepto</th><th style="text-align:center">Casilla</th><th class="num">Valor</th></tr></thead><tbody>' +
      filaFormHTML(51,"De bienes gravados a la tarifa general (nacionales)",c51) +
      filaFormHTML(54,"De bienes y servicios excluidos, exentos y no gravados",c54) +
      filaFormHTML(55,"Total compras e importaciones brutas",c55) +
      filaFormHTML(56,"Devoluciones en compras anuladas, rescindidas o resueltas en este período",c56) +
      filaFormHTML(57,"Total compras netas realizadas durante el período",c57) +
      filaFormHTML(72,"Por compras de bienes gravados a la tarifa general (impuesto descontable)",c72) +
      filaFormHTML(81,"Total impuestos descontables",c81) +
    '</tbody></table></div>' +

function formulario350HTML(per){
  var list = S.comprobantes.filter(function(c){ return c.periodo===per && c.tipo==="FC" && !/^Nota Crédito/.test(c.descripcion||""); });
  var buckets = {arrPJ:{base:0,ret:0}, arrPN:{base:0,ret:0}, compPJ:{base:0,ret:0}, compPN:{base:0,ret:0}};
  var sinClasificar = {base:0, ret:0, items:[]};
  var reteIvaTotal = 0;
  list.forEach(function(c){
    var nombre = extractTercFromDescripcion(c.descripcion);
    var tMatch = S.terceros.find(function(t){ return nombreCompletoTercero(t)===nombre; });
    var lineaRet = (c.lineas||[]).find(function(l){ return (l.cuenta||"").slice(0,4)==="2365"; });
    var lineaReteIva = (c.lineas||[]).find(function(l){ return (l.cuenta||"").slice(0,4)==="2367"; });
    if(lineaReteIva) reteIvaTotal += Number(lineaReteIva.credito)||0;
    if(!lineaRet) return;
    var montoRet = Number(lineaRet.credito)||0;
    var esArriendo = /arrendamientos/i.test(lineaRet.detalle||"");
    var base = 0;
    (c.lineas||[]).forEach(function(l){
      var pre = (l.cuenta||"").slice(0,2);
      if(pre==="14"||pre==="51"||pre==="52") base += Number(l.debito)||0;
    });
    if(!base) base = c.total_debito||0;
    if(!tMatch){
      sinClasificar.base+=base; sinClasificar.ret+=montoRet; sinClasificar.items.push(nombre);
      return;
    }
    var key = (esArriendo?"arr":"comp") + (tMatch.es_juridica?"PJ":"PN");
    buckets[key].base += base;
    buckets[key].ret += montoRet;
  });
  var c33=buckets.arrPJ.base, c46=buckets.arrPJ.ret;
  var c83=buckets.arrPN.base, c99=buckets.arrPN.ret;
  var c36=buckets.compPJ.base, c49=buckets.compPJ.ret;
  var c86=buckets.compPN.base, c102=buckets.compPN.ret;
  var c130 = c46+c49+c99+c102;
  var c131 = reteIvaTotal;
  var c134 = c131;
  var c136 = c130+c134;
  var c138 = c136;

  var alerta = sinClasificar.items.length ? ('<p class="small" style="color:var(--danger,#c0392b)">No se pudo clasificar el tercero (nombre en el comprobante no coincide con ningún tercero registrado) para: '+esc(Array.from(new Set(sinClasificar.items)).join(", "))+'. Base sin clasificar: '+fmtCOP(sinClasificar.base)+', retención: '+fmtCOP(sinClasificar.ret)+'. Revisa el nombre del tercero o regístralo.</p>') : "";

  var html = '<div class="card card-pad">' +
    '<div class="section-title">Declaración de Retención en la Fuente — Formulario 350 · '+esc(periodoLabel(per))+'</div>' +
    '<p class="small">Mensual · Calculado a partir de los comprobantes de compra de '+esc(periodoLabel(per))+' (no incluye devoluciones).</p>' +
    alerta +
    '<div class="small" style="font-weight:600;margin:16px 0 6px">A título de renta — Compras</div>' +
    '<div class="table-wrap"><table class="data"><thead><tr><th>Concepto</th><th style="text-align:center">Casilla base</th><th class="num">Base</th><th style="text-align:center">Casilla ret.</th><th class="num">Retención</th></tr></thead><tbody>' +
      '<tr><td>Compras — personas jurídicas</td><td class="mono" style="text-align:center">36</td><td class="num">'+fmtCOP(c36)+'</td><td class="mono" style="text-align:center">49</td><td class="num">'+fmtCOP(c49)+'</td></tr>' +
      '<tr><td>Compras — personas naturales</td><td class="mono" style="text-align:center">86</td><td class="num">'+fmtCOP(c86)+'</td><td class="mono" style="text-align:center">102</td><td class="num">'+fmtCOP(c102)+'</td></tr>' +
      '<tr><td>Arrendamientos — personas jurídicas</td><td class="mono" style="text-align:center">33</td><td class="num">'+fmtCOP(c33)+'</td><td class="mono" style="text-align:center">46</td><td class="num">'+fmtCOP(c46)+'</td></tr>' +
      '<tr><td>Arrendamientos — personas naturales</td><td class="mono" style="text-align:center">83</td><td class="num">'+fmtCOP(c83)+'</td><td class="mono" style="text-align:center">99</td><td class="num">'+fmtCOP(c99)+'</td></tr>' +
    '</tbody></table></div>' +
    '<div class="small" style="font-weight:600;margin:16px 0 6px">Totales</div>' +
    '<div class="table-wrap"><table class="data"><thead><tr><th>Concepto</th><th style="text-align:center">Casilla</th><th class="num">Valor</th></tr></thead><tbody>' +
      filaFormHTML(130,"Total retenciones renta y complementario",c130) +
      filaFormHTML(131,"Retenciones IVA practicadas a responsables",c131) +
      filaFormHTML(134,"Total retenciones IVA",c134) +
      filaFormHTML(136,"Total retenciones",c136) +
      filaFormHTML(138,"Total retenciones más sanciones",c138) +
    '</tbody></table></div>' +
    '<p class="small" style="margin-top:14px">No incluye honorarios, comisiones, servicios, rendimientos financieros ni pagos al exterior — Cuadre hoy solo calcula retención automática por compras y arrendamientos. Si el cliente tiene otros conceptos, decláralos aparte.</p>' +
  '</div>';
  return html;
}

function importarHTML(e){
  var body = '<div class="card card-pad">' +
    '<div class="section-title">1. Sube el reporte de la DIAN</div>' +
    '<p class="small" style="margin-bottom:12px">Descarga el Excel desde el enlace que te llega al correo de la DIAN (la hoja que empieza con "Rp_Doc") y súbelo aquí. Se compara el NIT de cada documento contra el NIT de <b>'+esc(e.nombre)+'</b> ('+esc(e.nit||"sin NIT registrado")+') para clasificar ventas y compras. Las compras cuyo NIT emisor esté registrado en <a class="link" onclick="app.setTab(\'terceros\')">Terceros</a> con Tipo <b>proveedor</b> se clasifican como compra de mercancía. Las que estén registradas con Tipo <b>personal</b> se marcan de una vez como gasto personal y quedan desmarcadas para que no las importes por accidente. Cualquier otro NIT (no registrado, o registrado como cliente/empleado/otro) se marca como <b>Diverso</b> — no significa que sea personal, solo que falta clasificar — y se importa igual en la cuenta genérica (5195) para que lo revises después en Comprobantes.</p>' +
    '<input type="file" id="import-file" accept=".xlsx,.xls" onchange="app.onImportFile(this.files[0])">' +
    (S.importBusy? '<div class="loading"><div class="spin"></div>'+(S.importProgress?("Guardando "+S.importProgress.done+" de "+S.importProgress.total+"…"):"Procesando…")+'</div>' : "") +
    (S.importErr? '<div class="login-err" style="margin-top:10px">'+esc(S.importErr)+'</div>' : "") +
  '</div>';

  if(S.importRows && S.importRows.length){
    var incluidos = S.importRows.filter(function(r){return r.include;}).length;
    var rows = S.importRows.map(function(r,i){
      var flags = "";
      if(r.dup) flags = '<span class="chip chip-warn"><span class="chip-dot"></span>Ya importado</span>';
      else if(!r.debeCuadra) flags = '<span class="chip chip-bad">No cuadra</span>';
      else if(r.esConocidoPersonal) flags = '<span class="chip chip-bad"><span class="chip-dot"></span>Personal (excluido)</span>';
      else if(r.esPersonal) flags = '<span class="chip chip-warn"><span class="chip-dot"></span>Diverso</span>';
      else if(r.porReglas) flags = '<span class="chip chip-good"><span class="chip-dot"></span>Por reglas</span>';
      return '<tr>' +
        '<td><input type="checkbox" '+(r.include?"checked":"")+' '+(!r.debeCuadra?"disabled":"")+' onchange="app.toggleImportRow('+i+',this.checked)"></td>' +
        '<td>'+fmtDate(r.fecha)+'</td>' +
        '<td>'+(r.esVenta?"Venta":"Compra")+(r.esNC?" (NC)":"")+'</td>' +
        '<td>'+esc(r.tercNombre)+'</td>' +
        '<td class="num">'+fmtCOP(r.total)+'</td>' +
        '<td>'+flags+'</td>' +
      '</tr>';
    }).join("");
    body += '<div class="toolbar" style="margin-top:18px"><div class="small">'+incluidos+' de '+S.importRows.length+' documento(s) seleccionados de "'+esc(S.importFileName)+'"</div>' +
      '<button class="btn btn-sm" onclick="app.confirmImport()" '+(incluidos?"":"disabled")+'>Importar seleccionados</button></div>' +
      '<div class="card table-wrap"><table class="data"><thead><tr><th></th><th>Fecha</th><th>Tipo</th><th>Tercero</th><th class="num">Total</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '<p class="small" style="margin-top:10px">Las compras quedan con una cuenta de gasto genérica (5195) por defecto — revísalas y reclasifícalas desde la pestaña Comprobantes después de importar.</p>';
  }

  body += '<div class="card card-pad" style="margin-top:18px">' +
    '<div class="section-title">2. Limpiar compras ya importadas</div>' +
    '<p class="small" style="margin-bottom:12px">Agrupa las compras que ya están guardadas por proveedor, para que revises cuáles no son del negocio y las elimines en bloque.</p>' +
    '<button class="btn btn-outline btn-sm" onclick="app.analizarCompras()">Analizar compras guardadas</button>';
  if(S.cleanupGroups){
    if(!S.cleanupGroups.length){
      body += '<p class="small" style="margin-top:10px">No hay comprobantes de compra guardados todavía.</p>';
    } else {
      var proveedoresNombres = S.terceros.filter(function(t){return t.tipo==="proveedor";}).map(function(t){return t.nombre.toLowerCase();});
      var selCount = S.cleanupGroups.filter(function(g){return g.checked;}).length;
      var rows2 = S.cleanupGroups.map(function(g,i){
        var esConocido = proveedoresNombres.indexOf(g.nombre.toLowerCase())>=0;
        return '<tr>' +
          '<td><input type="checkbox" '+(g.checked?"checked":"")+' onchange="app.toggleCleanupGroup('+i+',this.checked)"></td>' +
          '<td>'+esc(g.nombre)+(esConocido?' <span class="chip chip-good" style="margin-left:6px"><span class="chip-dot"></span>Proveedor registrado</span>':'')+'</td>' +
          '<td class="num">'+g.numeros.length+'</td>' +
          '<td class="num">'+fmtCOP(g.total)+'</td>' +
        '</tr>';
      }).join("");
      body += '<div class="toolbar" style="margin-top:14px"><div class="small">'+selCount+' de '+S.cleanupGroups.length+' proveedor(es) seleccionados para eliminar</div>' +
        '<button class="btn btn-outline btn-sm" style="border-color:var(--bad);color:var(--bad)" onclick="app.eliminarGruposSeleccionados()" '+(selCount?"":"disabled")+'>Eliminar seleccionados</button></div>' +
        '<div class="card table-wrap"><table class="data"><thead><tr><th></th><th>Proveedor (según descripción)</th><th class="num">Comprobantes</th><th class="num">Total</th></tr></thead><tbody>'+rows2+'</tbody></table></div>' +
        '<p class="small" style="margin-top:10px">Marca los proveedores que NO sean del negocio y elimínalos. Los marcados "Proveedor registrado" probablemente sí son reales — revísalos con cuidado antes de tildarlos.</p>';
    }
  }
  body += '</div>';
  return body;
}

  ["21","Tarjeta de extranjería"],["22","Cédula de extranjería"],["31","NIT"],
  ["33","Identificación extranjeros diferente a NIT"],["41","Pasaporte"],["42","Documento identificación extranjero"],
  ["43","Sin identificación del exterior"],["44","Documento identificación extranjero persona jurídica"],
  ["46","Carné diplomático"]
];
var pendingEsJuridica = true;
var editingTerceroId = null;
function selOpt(value, current){ return value===current ? " selected" : ""; }
function nuevoTerceroModal(){
  var t = editingTerceroId ? (S.terceros.find(function(x){return x.id===editingTerceroId;})||{}) : {};
  var docOpts = DIAN_DOC_TYPES.map(function(d){return '<option value="'+d[0]+'"'+selOpt(d[0],t.tipo_documento||"31")+'>'+d[0]+' - '+d[1]+'</option>';}).join("");
  var nombreFields = pendingEsJuridica ?
    '<div class="field"><label>Razón social</label><input id="t-razon" value="'+esc(t.razon_social||"")+'" placeholder="Nombre de la empresa"></div>' :
    '<div class="field-row"><div class="field"><label>Primer apellido</label><input id="t-ap1" value="'+esc(t.primer_apellido||"")+'"></div><div class="field"><label>Segundo apellido</label><input id="t-ap2" value="'+esc(t.segundo_apellido||"")+'"></div></div>' +
    '<div class="field-row"><div class="field"><label>Primer nombre</label><input id="t-nom1" value="'+esc(t.primer_nombre||"")+'"></div><div class="field"><label>Otros nombres</label><input id="t-nom2" value="'+esc(t.otros_nombres||"")+'"></div></div>';
  var tipoOpts = TIPOS_VALIDOS.map(function(v){return '<option value="'+v+'"'+selOpt(v,t.tipo||"proveedor")+'>'+cap(v)+'</option>';}).join("");
  return '<div class="modal-back" onclick="app.backdropClose(event)"><div class="modal" style="max-width:480px"><div class="modal-head"><h3>'+(editingTerceroId?"Editar tercero":"Nuevo tercero")+'</h3><button class="modal-x" onclick="app.closeModal()">✕</button></div>' +
  '<div class="modal-body">' +
    '<div class="radio-group" style="margin-bottom:13px">' +
      '<div class="radio-opt'+(pendingEsJuridica?" sel":"")+'" onclick="app.setEsJuridica(true)">Persona jurídica</div>' +
      '<div class="radio-opt'+(!pendingEsJuridica?" sel":"")+'" onclick="app.setEsJuridica(false)">Persona natural</div>' +
    '</div>' +
    nombreFields +
    '<div class="field-row"><div class="field"><label>Tipo de documento</label><select id="t-tipodoc">'+docOpts+'</select></div>' +
    '<div class="field"><label>Número identificación</label><input id="t-ident" value="'+esc(t.identificacion||"")+'" placeholder="C.C. / NIT"></div></div>' +
    '<div class="field-row"><div class="field"><label>Tipo (en Cuadre)</label><select id="t-tipo">'+tipoOpts+'</select></div>' +
    '<div class="field"><label>Régimen</label><select id="t-regimen">'+REGIMENES.map(function(r){return '<option value="'+r+'"'+selOpt(r,t.regimen||"")+'>'+(r||"N/A")+'</option>';}).join("")+'</select></div></div>' +
    '<div class="field"><label>Dirección</label><input id="t-direccion" value="'+esc(t.direccion||"")+'" placeholder="Cra / Calle..."></div>' +
    '<div class="field-row3"><div class="field"><label>Municipio</label><input id="t-ciudad" value="'+esc(t.ciudad||"")+'"></div>' +
    '<div class="field"><label>Departamento</label><input id="t-departamento" value="'+esc(t.departamento||"")+'"></div>' +
    '<div class="field"><label>País</label><input id="t-pais" value="'+esc(t.pais||"Colombia")+'"></div></div>' +
    '<div class="field" style="background:var(--surface-2);border-radius:8px;padding:10px;margin-top:2px">' +
      '<label style="display:flex;align-items:center;gap:7px;margin-bottom:9px"><input type="checkbox" id="t-autorretenedor" style="width:auto"'+(t.autorretenedor?" checked":"")+'> No se le practica retención (responsabilidad O-15 Autorretenedor u O-47 Régimen Simple)</label>' +
      '<label>Concepto de retención (si no es autorretenedor)</label>' +
      '<select id="t-concepto">'+CONCEPTOS_RETENCION.map(function(cr){return '<option value="'+cr[0]+'"'+selOpt(cr[0],t.concepto_retencion||"")+'>'+cr[1]+'</option>';}).join("")+'</select>' +
    '</div>' +
    '<div class="field" style="margin-top:8px">' +
      '<label>Concepto de ingreso (si este tercero te paga algo distinto de una venta normal)</label>' +
      '<select id="t-concepto-ingreso">'+CONCEPTOS_INGRESO.map(function(ci){return '<option value="'+ci[0]+'"'+selOpt(ci[0],t.concepto_ingreso||"")+'>'+ci[1]+'</option>';}).join("")+'</select>' +
    '</div>' +
  '</div><div class="modal-foot"><button class="btn btn-outline" onclick="app.closeModal()">Cancelar</button><button class="btn" onclick="app.submitTercero()">Guardar</button></div></div></div>';
}
function nuevaCuentaModal(){
  return '<div class="modal-back" onclick="app.backdropClose(event)"><div class="modal" style="max-width:440px"><div class="modal-head"><h3>Nueva cuenta</h3><button class="modal-x" onclick="app.closeModal()">✕</button></div>' +
  '<div class="modal-body">' +
    '<div class="field-row"><div class="field"><label>Código (4 o 6 dígitos)</label><input id="c-codigo" placeholder="Ej. 5199"></div>' +
    '<div class="field"><label>Tipo</label><select id="c-tipo"><option value="activo">Activo</option><option value="pasivo">Pasivo</option><option value="patrimonio">Patrimonio</option><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option><option value="costo">Costo</option></select></div></div>' +
    '<div class="field"><label>Nombre</label><input id="c-nombre" placeholder="Nombre de la cuenta"></div>' +
  '</div><div class="modal-foot"><button class="btn btn-outline" onclick="app.closeModal()">Cancelar</button><button class="btn" onclick="app.submitCuenta()">Guardar</button></div></div></div>';
}

/* ---------- modal: comprobante ---------- */
var draftLineas=[];
var draftTipo="NC", draftFecha=todayISO(), draftDescripcion="", draftPeriodo=null, draftId=null;

function nuevoComprobanteModal(){
  var per = S.periodo||todayPeriodo();
  var cuentaOpts = S.cuentas.filter(function(c){return c.postable;}).map(function(c){return '<option value="'+c.codigo+'">'+c.codigo+' - '+esc(c.nombre)+'</option>';}).join("");
  var tercOpts = '<option value="">—</option>'+S.terceros.map(function(t){return '<option value="'+t.id+'">'+esc(t.nombre)+'</option>';}).join("");
  var tot = totalsOf(draftLineas);
  var diff = tot.d-tot.c;
  var lineRows = draftLineas.map(function(l,i){
    return '<tr>' +
      '<td><select onchange="app.updLinea('+i+',\'cuenta\',this.value)">'+cuentaOpts.replace('value="'+l.cuenta+'"','value="'+l.cuenta+'" selected')+'</select></td>' +
      '<td><select onchange="app.updLinea('+i+',\'tercero\',this.value)">'+tercOpts.replace('value="'+l.tercero+'"','value="'+l.tercero+'" selected')+'</select></td>' +
      '<td><input value="'+esc(l.detalle)+'" oninput="app.updLinea('+i+',\'detalle\',this.value)" placeholder="Detalle"></td>' +
      '<td class="num"><input type="number" value="'+(l.debito||"")+'" oninput="app.updLinea('+i+',\'debito\',this.value)" placeholder="0"></td>' +
      '<td class="num"><input type="number" value="'+(l.credito||"")+'" oninput="app.updLinea('+i+',\'credito\',this.value)" placeholder="0"></td>' +
      '<td><button class="line-del" onclick="app.delLinea('+i+')">✕</button></td>' +
    '</tr>';
  }).join("");
  return '<div class="modal-back" onclick="app.backdropClose(event)"><div class="modal" style="max-width:760px"><div class="modal-head"><h3>'+(draftId?"Editar comprobante":"Nuevo comprobante")+'</h3><button class="modal-x" onclick="app.closeModal()">✕</button></div>' +
  '<div class="modal-body">' +
    '<div class="field-row3">' +
      '<div class="field"><label>Tipo</label><select id="v-tipo" onchange="app.setDraftField(\'tipo\',this.value)">'+COMPROB_TIPOS.map(function(t){return '<option value="'+t.k+'"'+(t.k===draftTipo?" selected":"")+'>'+t.label+'</option>';}).join("")+'</select></div>' +
      '<div class="field"><label>Fecha</label><input type="date" id="v-fecha" value="'+draftFecha+'" onchange="app.setDraftField(\'fecha\',this.value)"></div>' +
      '<div class="field"><label>Periodo</label><input id="v-periodo" value="'+(draftPeriodo||per)+'" disabled></div>' +
    '</div>' +
    '<div class="field"><label>Descripción</label><input id="v-desc" value="'+esc(draftDescripcion)+'" oninput="app.setDraftField(\'descripcion\',this.value)" placeholder="Concepto del comprobante"></div>' +
    '<div class="table-wrap"><table class="data lines-table"><thead><tr><th>Cuenta</th><th>Tercero</th><th>Detalle</th><th class="num">Débito</th><th class="num">Crédito</th><th></th></tr></thead><tbody>'+lineRows+'</tbody></table></div>' +
    '<button class="btn btn-outline btn-sm" style="margin-top:8px" onclick="app.addLinea()">+ Agregar línea</button>' +
    '<div class="totals-bar"><div><span class="t-lbl">Débitos</span><span class="t-val" id="v-totd">'+fmtCOP(tot.d)+'</span></div><div><span class="t-lbl">Créditos</span><span class="t-val" id="v-totc">'+fmtCOP(tot.c)+'</span></div><div class="'+(Math.abs(diff)<0.5&&tot.d>0?"diff-ok":"diff-off")+'" id="v-diffbox"><span class="t-lbl">Diferencia</span><span class="t-val" id="v-diff">'+fmtCOP(diff)+'</span></div></div>' +
  '</div>' +
  '<div class="modal-foot"><button class="btn btn-outline" onclick="app.closeModal()">Cancelar</button><button class="btn" id="v-savebtn" '+(Math.abs(diff)<0.5&&tot.d>0?"":"disabled")+' onclick="app.submitComprobante()">Guardar comprobante</button></div>' +
  '</div></div>';
}

/* ---------- public app object ---------- */
window.app = {
  setTab: function(t){ S.tab=t; render(); },
  setLibroSub: function(t){ S.libroSub=t; render(); },
  setFormSub: function(t){ S.formSub=t; render(); },
  setTercFiltro: function(t){ S.tercFiltro=t; render(); },
  setCompFiltro: function(t){ S.compFiltro=t; render(); },
  setPeriodo: function(p){ S.periodo=p; render(); },
  pickEmpresa: function(id){ S.tab="dashboard"; selectEmpresa(id); },
  backdropClose: function(ev){ if(ev.target===ev.currentTarget) closeModal(); },
  closeModal: closeModal,
  logout: doLogout,

  openNuevaEmpresa: function(){ pendingNiif=2; openModal(nuevaEmpresaModal()); },
  pickNiif: function(g){ pendingNiif=g; openModal(nuevaEmpresaModal()); },
  submitNuevaEmpresa: function(){
    var n=document.getElementById("f-nombre").value.trim();
    var nit=document.getElementById("f-nit").value.trim();
    var sec=document.getElementById("f-sector").value.trim();
    if(!n){ alert("Escribe el nombre de la empresa."); return; }
    crearEmpresa(n,nit,sec,pendingNiif);
  },
  crearDemo: crearEmpresaDemo,
  eliminarDemo: eliminarEmpresaDemo,

  openNuevoTercero: function(){ pendingEsJuridica=true; editingTerceroId=null; openModal(nuevoTerceroModal()); },
  openEditarTercero: function(id){
    var t = S.terceros.find(function(x){return x.id===id;});
    if(!t) return;
    editingTerceroId = id; pendingEsJuridica = !!t.es_juridica;
    openModal(nuevoTerceroModal());
  },
  setEsJuridica: function(v){ pendingEsJuridica=v; openModal(nuevoTerceroModal()); },
  submitTercero: function(){
    var d = {
      es_juridica: pendingEsJuridica,
      razon_social: pendingEsJuridica ? document.getElementById("t-razon").value.trim() : "",
      primer_apellido: pendingEsJuridica ? "" : document.getElementById("t-ap1").value.trim(),
      segundo_apellido: pendingEsJuridica ? "" : document.getElementById("t-ap2").value.trim(),
      primer_nombre: pendingEsJuridica ? "" : document.getElementById("t-nom1").value.trim(),
      otros_nombres: pendingEsJuridica ? "" : document.getElementById("t-nom2").value.trim(),
      tipo_documento: document.getElementById("t-tipodoc").value,
      identificacion: document.getElementById("t-ident").value.trim(),
      tipo: document.getElementById("t-tipo").value,
      regimen: document.getElementById("t-regimen").value,
      autorretenedor: document.getElementById("t-autorretenedor").checked,
      concepto_retencion: document.getElementById("t-concepto").value,
      concepto_ingreso: document.getElementById("t-concepto-ingreso").value,
      direccion: document.getElementById("t-direccion").value.trim(),
      ciudad: document.getElementById("t-ciudad").value.trim(),
      departamento: document.getElementById("t-departamento").value.trim(),
      pais: document.getElementById("t-pais").value.trim()
    };
    if(!nombreCompletoTercero(d)){ alert(pendingEsJuridica?"Escribe la razón social.":"Escribe al menos el primer nombre y primer apellido."); return; }
    if(editingTerceroId) actualizarTercero(editingTerceroId, d);
    else guardarTercero(d);
  },
  eliminarTercero: eliminarTercero,
  descargarPlantillaTerceros: descargarPlantillaTerceros,
  onTercerosImportFile: function(file){ if(!file) return; handleTercerosImportFile(file); },
  toggleTercImportRow: function(i,val){ S.tercImportRows[i].include=val; render(); },
  confirmTercImport: confirmTercImport,
  guardarAjustes: function(){
    var uvt=parseFloat(document.getElementById("cfg-uvt").value)||0;
    var tc=parseFloat(document.getElementById("cfg-tc").value)||0;
    var ta=parseFloat(document.getElementById("cfg-ta").value)||0;
    var bm=parseFloat(document.getElementById("cfg-bm").value)||0;
    guardarConfig(uvt,tc,ta,bm);
  },
  descargarPlantillaReglas: descargarPlantillaReglas,
  onReglasImportFile: function(file){ if(!file) return; handleReglasImportFile(file); },
  toggleReglaImportRow: function(i,val){ S.reglasImportRows[i].include=val; render(); },
  confirmReglasImport: confirmReglasImport,

  openNuevaCuenta: function(){ openModal(nuevaCuentaModal()); },
  submitCuenta: function(){
    var c=document.getElementById("c-codigo").value.trim();
    var n=document.getElementById("c-nombre").value.trim();
    var t=document.getElementById("c-tipo").value;
    if(!/^\d{4,6}$/.test(c)){ alert("El código debe tener 4 o 6 dígitos."); return; }
    if(!n){ alert("Escribe el nombre de la cuenta."); return; }
    guardarCuenta(c,n,t);
  },

  openNuevoComprobante: function(){
    draftId=null; draftTipo="NC"; draftFecha=todayISO(); draftDescripcion=""; draftPeriodo=S.periodo||todayPeriodo();
    var first=(S.cuentas.find(function(c){return c.postable;})||{}).codigo||"";
    draftLineas=[{cuenta:first,tercero:"",detalle:"",debito:0,credito:0},{cuenta:first,tercero:"",detalle:"",debito:0,credito:0}];
    openModal(nuevoComprobanteModal());
  },
  verComprobante: function(numero){
    var c=S.comprobantes.find(function(x){return x._id===numero;});
    if(!c) return;
    draftId=c._id; draftTipo=c.tipo; draftFecha=c.fecha; draftDescripcion=c.descripcion; draftPeriodo=c.periodo;
    draftLineas=(c.lineas||[]).map(function(l){return {cuenta:l.cuenta,tercero:l.tercero||"",detalle:l.detalle||"",debito:l.debito||0,credito:l.credito||0};});
    openModal(nuevoComprobanteModal());
  },
  setDraftField: function(k,v){
    if(k==="tipo") draftTipo=v;
    else if(k==="fecha"){
      draftFecha=v; draftPeriodo=v.slice(0,7);
      var pel=document.getElementById("v-periodo"); if(pel) pel.value=draftPeriodo;
    }
    else if(k==="descripcion") draftDescripcion=v;
  },
  addLinea: function(){
    var first=(S.cuentas.find(function(c){return c.postable;})||{}).codigo||"";
    draftLineas.push({cuenta:first,tercero:"",detalle:"",debito:0,credito:0}); openModal(nuevoComprobanteModal());
  },
  delLinea: function(i){ draftLineas.splice(i,1); openModal(nuevoComprobanteModal()); },
  updLinea: function(i,field,val){
    if(field==="debito"||field==="credito") draftLineas[i][field]=parseFloat(val)||0;
    else draftLineas[i][field]=val;
    if(field==="cuenta"||field==="tercero"){ openModal(nuevoComprobanteModal()); return; }
    if(field==="debito"||field==="credito"){ refreshTotalsBar(); }
  },
  submitComprobante: function(){
    if(!draftDescripcion.trim()){ alert("Escribe una descripción para el comprobante."); return; }
    guardarComprobante({_id:draftId, tipo:draftTipo, fecha:draftFecha, periodo:draftPeriodo||draftFecha.slice(0,7), descripcion:draftDescripcion, lineas:draftLineas});
  },
  eliminarComprobante: eliminarComprobante,
  eliminarComprobantesPeriodoTipo: eliminarComprobantesPeriodoTipo,
  generarCostoVenta: generarCostoVenta,

  cerrarPeriodo: function(p){
    var list=S.comprobantes.filter(function(c){return c.periodo===p;});
    var td=0,tc=0;
    list.forEach(function(v){ td+=v.total_debito||0; tc+=v.total_credito||0; });
    if(Math.abs(td-tc)>=1){ alert("Los débitos y créditos del periodo no cuadran. Corrígelo antes de cerrar."); return; }
    if(!confirm("¿Cerrar "+periodoLabel(p)+"? No podrás crear ni editar comprobantes de este mes hasta reabrirlo.")) return;
    cerrarPeriodoDb(p, td, tc);
  },
  reabrirPeriodo: function(p){
    if(!confirm("¿Reabrir "+periodoLabel(p)+"?")) return;
    reabrirPeriodoDb(p);
  },

  onImportFile: function(file){ if(!file) return; handleImportFile(file); },
  toggleImportRow: function(i,val){ S.importRows[i].include = val; render(); },
  confirmImport: confirmImport,

  analizarCompras: analizarCompras,
  toggleCleanupGroup: function(i,val){ S.cleanupGroups[i].checked = val; render(); },
  eliminarGruposSeleccionados: eliminarGruposSeleccionados
};

boot();
})();
</script>
</body>
</html>
