:root{

  --surface-2:#EFEBDE;
  --ink:#1E2A22;
  --ink-soft:#5B6A5F;
  --ink-faint:#8B9A8E;
  --border:#DED6C2;

*{box-sizing:border-box}
html,body{margin:0;padding:0}

button{font-family:var(--font-ui);cursor:pointer}
input,select,textarea{font-family:var(--font-ui)}
img{max-width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 6px}
.brand-mark{width:9px;height:9px;border-radius:2px;background:var(--accent);flex:none;transform:rotate(45deg)}
.brand-name{font-size:18px;font-weight:700;letter-spacing:.01em}

.empresa-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px}
.empresa-box label{display:block;font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.empresa-box select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 8px;font-size:13px}
.empresa-meta{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:100px;letter-spacing:.02em}

.btn-ghost-sm{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--border);color:var(--ink-soft);border-radius:7px;padding:6px;font-size:12px;font-weight:500}

.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border:none;background:transparent;text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-ico{width:16px;text-align:center;font-size:13px}

.sidebar-foot{margin-top:auto;font-size:11px;color:var(--ink-faint);padding:0 6px;line-height:1.6}

.sidebar-foot a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}

.main{padding:26px 34px 60px;max-width:1180px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.topbar h1{font-size:22px}
.topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:3px}
.period-switch{display:flex;align-items:center;gap:8px}
.period-switch select{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13px}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.section-title{font-size:11.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

.indent-1{padding-left:18px!important}

a.link{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}

.small{font-size:11.5px;color:var(--ink-faint)}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;box-shadow:var(--shadow);padding:28px 26px}

.login-err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:12px}
</style>

function fmtCOP(n){
  n = Math.round(n||0);
  var neg = n<0; n=Math.abs(n);
  var s = n.toLocaleString('es-CO');
  return (neg?"-$ ":"$ ")+s;
}

function recargarLocal(tabla, scopes){
  var id = S.empresaId, f = null;
  if(tabla==="empresas") f = loadEmpresas;
  else if(tabla==="config") f = loadConfig;
  else if(tabla==="reglas_cuentas") f = loadReglasCuentas;
  else if(id && scopes.indexOf(id)>=0){
    f = ({comprobantes:loadComprobantes, terceros:loadTerceros, cuentas:loadCuentas, periodos:loadPeriodos})[tabla];
    if(f){ var g = f; f = function(){ return g(id); }; }
  }
  if(!f) return;
  if(recargas[tabla]) clearTimeout(recargas[tabla]);
  recargas[tabla] = setTimeout(function(){ Promise.resolve(f()).then(render); }, 400);
}
function recargarTodo(){
  loadEmpresas();
  loadConfig().then(render);
  loadReglasCuentas().then(render);
  var id = S.empresaId;
  if(id) Promise.all([loadCuentas(id), loadTerceros(id), loadComprobantes(id), loadPeriodos(id)]).then(render);
}
async function descargarParaSinConexion(){
  if(!CuadreOffline.enLinea()){ alert("Necesitas internet para guardar la copia."); return; }
  if(S.copiaBusy) return;
  S.copiaBusy = true; S.copiaMsg = ""; render();
  try{
    for(var i=0;i<S.empresas.length;i++){
      var e = S.empresas[i];
      S.copiaMsg = "Guardando "+e.nombre+" ("+(i+1)+" de "+S.empresas.length+")…"; render();
      await Promise.all([loadAllRows("cuentas", e.id), loadAllRows("terceros", e.id), loadAllRows("comprobantes", e.id), loadAllRows("periodos", e.id)]);
    }
    await loadReglasCuentas(); await loadConfig();
    S.copiaMsg = "Listo: copia guardada de "+S.empresas.length+" empresa(s).";
  }catch(err){ S.copiaMsg = "No se pudo guardar la copia: "+err.message; }
  S.copiaBusy = false; render();
}
/* ---------- respaldo completo en un archivo (independiente de Supabase) ---------- */
var LS_RESPALDO = "cuadre_ultimo_respaldo";
function nombreArchivoSeguro(s){ return String(s||"empresa").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40); }
async function guardarArchivoRespaldo(blob, nombre){
  // Chrome/Edge: deja elegir la carpeta (empieza en el Escritorio). Otros navegadores: descarga normal.
  if(window.showSaveFilePicker){
    try{
      var h = await window.showSaveFilePicker({suggestedName:nombre, startIn:"desktop", types:[{description:"Respaldo de Cuadre (.zip)", accept:{"application/zip":[".zip"]}}]});
      var w = await h.createWritable(); await w.write(blob); await w.close();
      return true;
    }catch(err){
      if(err && err.name==="AbortError") return false;   // canceló: no se cuenta como respaldo
    }
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}
async function respaldoCompleto(){
  if(S.respaldoBusy) return;
  if(typeof JSZip==="undefined"){ alert("No se cargó el compresor. Recarga la página (Ctrl+F5) e inténtalo de nuevo."); return; }
  S.respaldoBusy = true; S.respaldoMsg = "Preparando el respaldo…"; render();
  try{
    var zip = new JSZip();
    var hoy = todayISO();
    var resumen = [];
    zip.file("LEEME.txt",
      "Respaldo de Cuadre generado el "+hoy+" por "+(S.session&&S.session.user?S.session.user.email:"")+".\r\n\r\n"+
      "Contiene TODA la información en archivos .json (texto), una carpeta por empresa:\r\n"+
      "  cuentas.json, terceros.json, comprobantes.json, periodos.json\r\n"+
      "y, en la raíz: empresas.json, config.json, reglas_cuentas.json.\r\n\r\n"+
      "Sirve para recuperar todo si Supabase se pausa o se pierde: los datos conservan sus identificadores originales.\r\n"+
      "Guárdalo en un lugar seguro (disco externo o la nube) y no lo edites a mano.\r\n");
    zip.file("empresas.json", JSON.stringify(S.empresas));
    for(var i=0;i<S.empresas.length;i++){
      var e = S.empresas[i];
      var carpeta = "empresas/"+nombreArchivoSeguro(e.nombre)+"_"+String(e.id).slice(0,8)+"/";
      var conteo = {};
      var tablas = ["cuentas","terceros","comprobantes","periodos"];
      for(var k=0;k<tablas.length;k++){
        S.respaldoMsg = "Respaldando "+e.nombre+" · "+tablas[k]+" ("+(i+1)+" de "+S.empresas.length+")…"; render();
        var filas = await loadAllRows(tablas[k], e.id);
        conteo[tablas[k]] = filas.length;
        zip.file(carpeta+tablas[k]+".json", JSON.stringify(filas));
      }
      resumen.push(e.nombre+": "+conteo.comprobantes+" comprobantes, "+conteo.terceros+" terceros, "+conteo.cuentas+" cuentas");
    }
    S.respaldoMsg = "Guardando datos generales…"; render();
    zip.file("reglas_cuentas.json", JSON.stringify(await loadAllRows("reglas_cuentas", null, true)));
    zip.file("config.json", JSON.stringify(S.config || {}));
    zip.file("RESUMEN.txt", resumen.join("\r\n")+"\r\n");
    S.respaldoMsg = "Comprimiendo…"; render();
    var blob = await zip.generateAsync({type:"blob", compression:"DEFLATE", compressionOptions:{level:6}});
    var guardado = await guardarArchivoRespaldo(blob, "cuadre_respaldo_"+hoy+".zip");
    if(guardado){
      try{ localStorage.setItem(LS_RESPALDO, String(Date.now())); }catch(e2){}
      S.respaldoMsg = "Respaldo guardado ("+(blob.size/1048576).toFixed(1)+" MB). "+resumen.length+" empresa(s).";
    } else S.respaldoMsg = "Respaldo cancelado: no se guardó ningún archivo.";
  }catch(err){ S.respaldoMsg = "No se pudo hacer el respaldo: "+err.message; }
  S.respaldoBusy = false; render();
}
function respaldoHTML(){
  var t = 0; try{ t = parseInt(localStorage.getItem(LS_RESPALDO)||"0", 10); }catch(e){}
  var dias = t ? Math.floor((Date.now()-t)/86400000) : null;
  var viejo = dias===null || dias>=7;
  var estado = dias===null ? "Aún no has hecho ningún respaldo en archivo."
    : (dias===0 ? "Último respaldo: hoy." : "Último respaldo: hace "+dias+" día(s).");
  return '<div class="small" style="margin-top:6px;'+(viejo?'color:var(--danger,#c0392b);font-weight:600':'')+'">'+esc(estado)+'</div>' +
    '<div class="small" style="margin-top:2px"><a onclick="app.respaldoCompleto()">'+(S.respaldoBusy?"Haciendo respaldo…":"Guardar respaldo en un archivo")+'</a></div>' +
    (S.respaldoMsg ? '<div class="small" style="margin-top:2px">'+esc(S.respaldoMsg)+'</div>' : '');
}
function estadoConexionHTML(){
  var st = CuadreOffline.estado();
  var txt, cls;
  if(!st.online){ txt = "Sin conexión · trabajando con la copia de este computador"; cls = "chip-warn"; }
  else if(st.sincronizando){ txt = "Subiendo cambios…"; cls = "chip-warn"; }
  else { txt = "En línea"; cls = "chip-good"; }
  var html = '<div style="margin-bottom:8px"><span class="chip '+cls+'"><span class="chip-dot"></span>'+esc(txt)+'</span>';
  if(st.pendientes) html += '<div class="small" style="margin-top:4px"><b>'+st.pendientes+'</b> cambio(s) por subir'+(st.online&&!st.sincronizando?' · <a onclick="app.sincronizarAhora()">Subir ahora</a>':'')+'</div>';
  if(st.error) html += '<div class="small" style="margin-top:4px;color:var(--danger,#c0392b)">'+esc(st.error)+'</div>';
  if(st.online) html += '<div class="small" style="margin-top:4px"><a onclick="app.guardarCopia()">'+(S.copiaBusy?"Guardando copia…":"Guardar copia para trabajar sin conexión")+'</a></div>';
  if(S.copiaMsg) html += '<div class="small" style="margin-top:4px">'+esc(S.copiaMsg)+'</div>';
  html += respaldoHTML();
  return html + '</div>';
}
function boot(){
  render();
  CuadreOffline.alCambiar(renderPronto);
  CuadreOffline.alCambioLocal(recargarLocal);
  CuadreOffline.alSincronizar(recargarTodo);
  CuadreOffline.alSesionVencida(function(){ if(S.session) cerrarSesionLocal(); });
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
  sb.auth.getSession().then(function(res){
    S.session = res.data.session; S.authChecked = true;
    // Sin internet no se puede renovar la sesión: se entra con el último usuario que inició sesión en este equipo.
    var local = CuadreOffline.usuarioLocal();
    var sinRed = !navigator.onLine || (res.error && /fetch|network/i.test(String(res.error.message||"")));
    if(!S.session && local && sinRed){ CuadreOffline.marcarSinConexion(); S.session = {user:local, local:true}; }
    if(S.session && S.session.user) CuadreOffline.recordarUsuario(S.session.user);
    render();
    if(S.session) afterLogin();
  });
  sb.auth.onAuthStateChange(function(event, session){
    var had = !!S.session;
    S.session = session;
    if(session && session.user) CuadreOffline.recordarUsuario(session.user);
    if(session && !had){ render(); afterLogin(); }
    else if(!session && had){ teardownEmpresa(); S.empresas=[]; S.empresaId=null; clearMainChannels(); render(); }
  });
}

async function loadEmpresas(){
  var res = await sb.from("empresas").select("*").order("nombre");
  if(res.error){ console.error(res.error); return; }
  S.empresas = res.data || [];
  guardarCopiaLocal("empresas", null, S.empresas);
  if(!S.empresaId && S.empresas.length){ selectEmpresa(S.empresas[0].id); }
  else if(S.empresaId && !S.empresas.some(function(e){return e.id===S.empresaId;})){
    S.empresaId = S.empresas.length?S.empresas[0].id:null;
    if(S.empresaId) selectEmpresa(S.empresaId); else { teardownEmpresa(); render(); }
  } else render();
}

async function selectEmpresa(id){
  if(S.empresaId===id && S.cuentas.length){ render(); return; }

  teardownEmpresa();

  if(!id) return;
  await Promise.all([loadCuentas(id), loadTerceros(id), loadComprobantes(id), loadPeriodos(id)]);
  render();
  var chC = sb.channel("cuentas-"+id).on("postgres_changes",{event:"*",schema:"public",table:"cuentas",filter:"empresa_id=eq."+id},debounce(function(){ loadCuentas(id).then(render); })).subscribe();

}

async function loadAllRows(table, id, global){
  var pageSize=1000;
  function q(){ var b=sb.from(table).select("*",{count:"exact"}); return global?b:b.eq("empresa_id",id); }
  function qPage(){ var b=sb.from(table).select("*"); return global?b:b.eq("empresa_id",id); }
  var first = await q().range(0, pageSize-1);
  if(first.error){ console.error(first.error); return []; }
  var all = first.data||[];
  var total = first.count==null ? all.length : first.count;
  var pages = Math.ceil(total/pageSize);
  if(pages>1){
    var reqs=[];
    for(var p=1;p<pages;p++){
      reqs.push(qPage().range(p*pageSize, p*pageSize+pageSize-1));
    }
    var results = await Promise.all(reqs);
    results.forEach(function(res){
      if(res.error) console.error(res.error);
      else all = all.concat(res.data||[]);
    });
  }
  guardarCopiaLocal(table, global?null:id, all);
  return all;
}
// Guarda en este computador la última copia de una tabla, para poder trabajar sin internet.
// Solo se guarda lo que vino de internet y cuando no hay cambios pendientes de subir
// (si los hubiera, la copia del servidor todavía no los incluye).
function guardarCopiaLocal(tabla, scope, filas){
  var st = CuadreOffline.estado();
  if(!st.online || st.pendientes>0 || st.sincronizando) return;
  CuadreOffline.guardarTabla(tabla, scope, filas);
}
async function loadCuentas(id){
  var data = await loadAllRows("cuentas", id);
  var list = data.map(function(r){ r._id=r.codigo; return r; });
  list.sort(function(a,b){ return a.codigo.localeCompare(b.codigo); });
  S.cuentas = list;
}
async function loadTerceros(id){
  var data = await loadAllRows("terceros", id);
  var list = data.map(function(r){ r._id=r.id; return r; });
  list.sort(function(a,b){ return (a.nombre||"").localeCompare(b.nombre||""); });
  S.terceros = list;
}
async function loadComprobantes(id){
  var data = await loadAllRows("comprobantes", id);
  var list = data.map(function(r){ r._id=r.numero; return r; });
  list.sort(function(a,b){ if(a.fecha!==b.fecha) return a.fecha<b.fecha?-1:1; return (a._id||"").localeCompare(b._id||""); });
  S.comprobantes = list;
  if(!S.periodo){ var ps=distinctPeriodos(); S.periodo = ps.length?ps[ps.length-1]:todayPeriodo(); }
}
async function loadPeriodos(id){
  var data = await loadAllRows("periodos", id);
  var map={}; data.forEach(function(r){ map[r.periodo]=r; });
  S.periodosDocs = map;
}

function distinctPeriodos(){
  var set={};
  S.comprobantes.forEach(function(c){ if(c.periodo) set[c.periodo]=1; });
  set[todayPeriodo()]=1;
  return Object.keys(set).sort();
}
function currentEmpresa(){ return S.empresas.find(function(e){return e.id===S.empresaId;}); }
function cuentaByCodigo(c){ return S.cuentas.find(function(x){return x.codigo===c;}); }
function terceroById(id){ return S.terceros.find(function(t){return t.id===id;}); }
function mayorDe(codigo){ return (codigo||"").slice(0,4); }
function cod6(codigo){ return codigo && codigo.length>6 ? codigo.slice(0,6) : codigo; }
function agruparPorMayor(items, campos){
  var out = {};
  items.forEach(function(it){
    var mayor = mayorDe(it.codigo);
    if(!out[mayor]) out[mayor] = {codigo:mayor, nombre:"", tipo:it.tipo, naturaleza:it.naturaleza, subs:[]};
    var g = out[mayor];
    campos.forEach(function(f){ g[f] = (g[f]||0) + (Number(it[f])||0); });
    if(it.codigo===mayor) g.nombre = it.nombre;
    else g.subs.push(it);
  });
  Object.keys(out).forEach(function(mayor){
    var g = out[mayor];
    if(!g.nombre){
      var ac = cuentaByCodigo(mayor);
      g.nombre = ac ? ac.nombre : mayor;
    }
    g.subs.sort(function(a,b){ return a.codigo<b.codigo?-1:(a.codigo>b.codigo?1:0); });
  });
  return out;
}

  var ins = await sb.from("empresas").insert({nombre:nombre, nit:nit, sector:sector, grupo_niif:grupo, creada:todayISO(), demo:false,

/* ---------- comprobantes ---------- */
function totalsOf(lineas){
  var d=0,c=0;
  lineas.forEach(function(l){ d+=Number(l.debito)||0; c+=Number(l.credito)||0; });
  return {d:d,c:c};
}
var TOLERANCIA_AJUSTE_PESO = 50;
function balancearAjustePeso(lineas, tercero){
  var tot = totalsOf(lineas);
  var diff = tot.d - tot.c;
  if(Math.abs(diff) < 0.005) return lineas;
  if(Math.abs(diff) > TOLERANCIA_AJUSTE_PESO) return null;
  var ajuste = Math.round(Math.abs(diff)*100)/100;
  var nuevaLinea = diff>0
    ? {cuenta:"429550", tercero:tercero||"", detalle:"Ajuste al peso - Ingreso", debito:0, credito:ajuste}
    : {cuenta:"530595", tercero:tercero||"", detalle:"Ajuste al peso - Gasto", debito:ajuste, credito:0};
  return lineas.concat([nuevaLinea]);
}
function terceroDeLineas(lineas){
  var conTercero = (lineas||[]).find(function(l){ return l.tercero; });
  return conTercero ? conTercero.tercero : "";
}
function nextNumero(prefix, periodo){
  var max=0;
  S.comprobantes.forEach(function(c){
    if(c.tipo===prefix && c.periodo===periodo){
      var n=parseInt((c._id||"").split("-").pop(),10);
      if(n>max) max=n;
    }
  });
  return prefix+"-"+periodo+"-"+String(max+1).padStart(4,"0");
}
function periodoCerrado(p){ return S.periodosDocs[p] && S.periodosDocs[p].estado==="cerrado"; }

var ERROR_SUBCUENTA_INVALIDA = "Contabilización inválida. Debe seleccionar obligatoriamente una subcuenta de 6 dígitos";
function validarSubcuentas(lineas){
  return (lineas||[]).every(function(l){ return String(l.cuenta||"").length===6; });
}
async function guardarComprobante(data){
  var tot0=totalsOf(data.lineas);
  if(Math.abs(tot0.d-tot0.c)>0.005 && tot0.d>0){
    var ajustadas = balancearAjustePeso(data.lineas, terceroDeLineas(data.lineas));
    if(!ajustadas){ alert("El comprobante debe cuadrar (débitos = créditos) antes de guardarlo. La diferencia supera el margen de ajuste automático ("+TOLERANCIA_AJUSTE_PESO+" pesos) — revisa las líneas."); return; }
    data = {_id:data._id, tipo:data.tipo, fecha:data.fecha, periodo:data.periodo, descripcion:data.descripcion, lineas:ajustadas};
  }
  var tot=totalsOf(data.lineas);
  if(Math.abs(tot.d-tot.c)>0.5 || tot.d===0){ alert("El comprobante debe cuadrar (débitos = créditos) antes de guardarlo."); return; }
  if(!validarSubcuentas(data.lineas)){ alert(ERROR_SUBCUENTA_INVALIDA); return; }
  if(periodoCerrado(data.periodo)){ alert("Ese periodo ya está cerrado. Reábrelo desde Periodos para poder modificarlo."); return; }
  var numero = data._id || nextNumero(data.tipo, data.periodo);
  var row = {
    empresa_id:S.empresaId, numero:numero, tipo:data.tipo, fecha:data.fecha, periodo:data.periodo, descripcion:data.descripcion,
    lineas:data.lineas, total_debito:tot.d, total_credito:tot.c, estado:"contabilizado"
  };
  var res = await sb.from("comprobantes").upsert(row,{onConflict:"empresa_id,numero"});
  if(res.error){ alert("No se pudo guardar: "+res.error.message); return; }
  closeModal();
}
var TASA_COSTO_VENTA = 80;
function generarCostoVenta(per){
  if(periodoCerrado(per)){ alert("No puedes generar comprobantes en un periodo cerrado."); return; }
  var yaExiste = S.comprobantes.some(function(c){ return c.periodo===per && c.tipo==="CV"; });
  if(yaExiste && !confirm("Ya existe un comprobante de Costo de Venta para "+periodoLabel(per)+". ¿Generar uno nuevo de todas formas? (el anterior no se elimina solo)")) return;

  var gravadaNeta=0, exentaNeta=0;
  S.comprobantes.forEach(function(c){
    if(c.periodo!==per || c.tipo!=="FV") return;
    var esDevol = /^Nota Crédito/.test(c.descripcion||"");
    var s = gravadaExentaDe(ivaMainDe(c));
    if(esDevol){ gravadaNeta -= s.gravada; exentaNeta -= s.exenta; }
    else { gravadaNeta += s.gravada; exentaNeta += s.exenta; }
  });
  var totalBase = gravadaNeta+exentaNeta;
  if(totalBase<=0){ alert("No hay ventas netas en "+periodoLabel(per)+" para calcular el costo de venta."); return; }
  var costoTotal = Math.round(totalBase * TASA_COSTO_VENTA / 100);
  var costoGravada = Math.round(costoTotal * gravadaNeta/totalBase);
  var costoExenta = costoTotal - costoGravada;
  var lineas = [{cuenta:"613501", tercero:"", detalle:"Costo de venta "+TASA_COSTO_VENTA+"% - "+periodoLabel(per), debito:costoTotal, credito:0}];
  if(costoGravada>0) lineas.push({cuenta:"143501", tercero:"", detalle:"Costo de venta - mercancía gravada 19%", debito:0, credito:costoGravada});
  if(costoExenta>0) lineas.push({cuenta:"143590", tercero:"", detalle:"Costo de venta - mercancía exenta/excluida", debito:0, credito:costoExenta});
  guardarComprobante({tipo:"CV", fecha: per+"-01", periodo:per, descripcion:"Costo de venta ("+TASA_COSTO_VENTA+"%) - "+periodoLabel(per), lineas:lineas});
}

function celdaPlantilla(row, encabezado){

        // Si viene vacío, se deduce de si hay razón social o nombres.
        var esJur = tipoDocRaw ? tipoDocRaw==="31" : (!!razon || nombreEsDeEmpresa([ap1,ap2,nom1,nom2].join(" ")));
        var partesNom = [ap1, ap2, nom1, nom2].filter(Boolean);
        if(esJur && !razon){ razon = partesNom.join(" "); ap1 = ap2 = nom1 = nom2 = ""; }

          ap1 = sep.primer_apellido||""; ap2 = sep.segundo_apellido||""; nom1 = sep.primer_nombre||""; nom2 = sep.otros_nombres||""; razon = "";
        } else if(!esJur){ razon = ""; }
        var d = {es_juridica:esJur, razon_social:razon, primer_apellido:ap1, segundo_apellido:ap2, primer_nombre:nom1, otros_nombres:nom2};
        var nombre = nombreCompletoTercero(d);
        if(!nombre) return;
        var ident = String(row["Número identificación"]||"").trim();
        var tipoTxt = normTextoPlantilla(celdaPlantilla(row, "tipo"));
        var tipoDefinido = tipoTxt!=="";
        var tipo = tipoTxt || "proveedor";
        // La columna Tipo también puede traer el concepto (seguro, flete, servicio público, diverso...)
        var concDeTipo = {seguro:"seguros", seguros:"seguros", flete:"fletes", fletes:"fletes", servicio_publico:"servicios_publicos", servicios_publicos:"servicios_publicos",
          energia:"energia", acueducto:"acueducto", telefono:"telefono", internet:"internet", afiliacion:"afiliaciones", afiliaciones:"afiliaciones",
          publicidad:"publicidad", diverso:"diversos", diversos:"diversos"}[tipo] || "";
        if(concDeTipo) tipo = "otro";
        if(TIPOS_VALIDOS.indexOf(tipo)<0) tipo = "proveedor";
        // Columna "¿Aplica retención?" (SI = se le practica retención; NO = no se le practica).
        // Acepta cualquier variante del encabezado y el antiguo "Sin retención" (valor invertido).
        var aplicaTxt = normTextoPlantilla(celdaPlantilla(row, "aplica retencion"));
        var sinRetTxt = normTextoPlantilla(celdaPlantilla(row, "sin retencion"));
        var retDefinida = aplicaTxt!=="" || sinRetTxt!=="";
        var sinRet = aplicaTxt!=="" ? /^n/.test(aplicaTxt) : /^s/.test(sinRetTxt);
        var concTxt = normTextoPlantilla(celdaPlantilla(row, "concepto retencion"));
        var conc = ({compra:"compras", arrendamiento:"arrendamientos", servicio_publico:"servicios_publicos", seguro:"seguros", flete:"fletes", afiliacion:"afiliaciones", diverso:"diversos"}[concTxt]) || concTxt;
        if(CONCEPTOS_RETENCION.map(function(cr){return cr[0];}).indexOf(conc)<0) conc = "";
        if(!conc && concDeTipo) conc = concDeTipo;

          tipoDefinido:tipoDefinido, retDefinida:retDefinida,

  });
  S.tercImportBusy=true; render();

      alert("Se importaron "+done+" de "+toInsert.length+" antes de un error: "+res.error.message);

    batch.forEach(function(r){ S.terceros.push(Object.assign({_id:r.identificacion||("tmp-"+Math.random())},r)); });

  S.tercImportBusy=false;

/* ---------- importador DIAN ---------- */
function normDigits(s){ return String(s||"").replace(/\D/g,""); }
function normNit(s){ return normDigits(s).replace(/^0+/,""); }
function nitMatches(a,b){
  var x=normNit(a), y=normNit(b);
  if(!x||!y) return false;
  if(x===y) return true;
  if(Math.abs(x.length-y.length)===1){
    var longer = x.length>y.length?x:y, shorter=x.length>y.length?y:x;
    return longer.slice(0,shorter.length)===shorter;
  }
  return false;
}
function excelDateToISO(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
  return null;
}
function slotDeCuenta(codigo){
  var c4 = codigo.slice(0,4);
  if(c4==="1305") return "receivable";
  if(c4==="1355") return "retFavor";
  if(c4==="2205") return "payable";
  if(c4==="2365") return "reteRenta";
  if(c4==="2367") return "reteIva";
  if(c4==="2368") return "reteIca";
  if(c4==="2408") return "iva";
  var c1 = codigo[0];
  if(c1==="4"||c1==="5"||c1==="6") return /590$/.test(codigo) ? "mainExenta" : "mainGravada";
  return "otro";
}
// Base mínima de retención en la fuente para compras generales según la fecha.
// Decreto 572 de 2025: 10 UVT. El Consejo de Estado suspendió sus artículos 2 a 8 el
// 7-may-2026; del 8-may al 30-jun-2026 rigieron las bases del Decreto 1625 de 2016
// (compras: 27 UVT, DIAN Comunicado 070). Tras revocar la suspensión (auto del
// 2-jun-2026) el 572 vuelve desde el 1-jul-2026.
var SUSPENSION_572_DESDE = "2026-05-08", SUSPENSION_572_HASTA = "2026-06-30";
function baseMinimaCompras(fecha, config){
  if(fecha >= SUSPENSION_572_DESDE && fecha <= SUSPENSION_572_HASTA) return Math.round(27 * ((config && config.uvt) || 52374));
  return (config && config.base_minima) || 524000;
}
function buildDraftFromDianRow(row, empresa, proveedores, terceros, config, reglas){
  var tipoDocRaw = String(row["Tipo de documento"]||"");
  var esNC = /cr[eé]dito/i.test(tipoDocRaw);
  var esND = !esNC && /d[eé]bito/i.test(tipoDocRaw);
  var esDocSoporte = /documento\s*soporte/i.test(tipoDocRaw);
  var empresaEsEmisor = nitMatches(row["NIT Emisor"], empresa.nit);
  var empresaEsReceptor = !empresaEsEmisor && nitMatches(row["NIT Receptor"], empresa.nit);
  if(!empresaEsEmisor && !empresaEsReceptor) return null;
  // El Documento Soporte lo emite la propia empresa (NIT Emisor = empresa) aunque
  // económicamente es una compra a alguien no obligado a facturar (ej. arriendo a
  // una persona natural) -- por eso se trata como compra aunque la empresa figure
  // como emisora, y la contraparte real sigue viniendo de los campos "Receptor".
  var esVenta = empresaEsEmisor && !esDocSoporte;
  var esCompra = !esVenta;

  var total = Number(row["Total"])||0;
  // Algunas facturas de bonificación/descuento del proveedor netean a Total = 0
  // (una base exenta negativa que compensa una base gravada + su IVA) pero sí
  // traen movimiento real -- solo se descartan las filas realmente vacías.
  if(total<=0 && (Number(row["IVA"])||0)<=0) return null;
  var iva = Number(row["IVA"])||0;
  var reteIva = Number(row["Rete IVA"])||0;
  var reteRenta = Number(row["Rete Renta"])||0;
  var reteIca = Number(row["Rete ICA"])||0;
  var fecha = excelDateToISO(row["Fecha Emisión"]);
  if(!fecha) return {_error:"fecha", raw: row["Fecha Emisión"]};
  var cufe = row["CUFE/CUDE"]||"";
  var tercNombre = empresaEsEmisor ? (row["Nombre Receptor"]||"") : (row["Nombre Emisor"]||"");
  var tercIdent = String(empresaEsEmisor ? (row["NIT Receptor"]||"") : (row["NIT Emisor"]||"")).trim();
  var docRef = (row["Prefijo"]||"")+""+(row["Folio"]||"");

  var retNota = "";
  var tMatch = (terceros||[]).find(function(t){ return nitMatches(empresaEsEmisor?row["NIT Receptor"]:row["NIT Emisor"], t.identificacion); });
  // Si el tercero está configurado como fuente de ingresos por arriendo/semovientes,
  // el dinero que se mueve con él siempre es ingreso para el negocio, aunque el
  // documento de la DIAN venga en dirección de compra (empresa como receptora) --
  // ej. un Documento Soporte que llega de un arrendatario.
  if(esCompra && tMatch && (tMatch.concepto_ingreso==="arriendo" || tMatch.concepto_ingreso==="semovientes")){
    esVenta = true; esCompra = false;
  }
  if(esCompra && tMatch && config){
    if(tMatch.autorretenedor){ reteRenta = 0; retNota = " (O-15/O-47, sin retención)"; }
    else if(tMatch.concepto_retencion==="compras" || tMatch.concepto_retencion==="arrendamientos"){
      var base = total - iva;
      var tasa = tMatch.concepto_retencion==="compras" ? config.tasa_compras : config.tasa_arrendamientos;
      var baseMin = tMatch.concepto_retencion==="compras" ? baseMinimaCompras(fecha, config) : config.base_minima;
      reteRenta = base >= baseMin ? Math.round(base * tasa / 100) : 0;
      retNota = " ("+tMatch.concepto_retencion+" "+tasa+"%)";
    }
    else if(CONCEPTOS_SIN_RETENCION.indexOf(tMatch.concepto_retencion)>=0){ reteRenta = 0; }
  }

  function splitGravadaExenta(){
    // El IVA de la DIAN viene redondeado al peso; al revertir la base con
    // IVA/19% y redondearla, cualquier residuo que quede en la exenta es puro
    // ruido de redondeo (no una exenta real), así que se limpia hasta $5.
    var baseGravada = iva>0 ? Math.round(iva/19*100) : 0;
    var baseExenta = total - iva - baseGravada;
    if(total>0){
      // Solo se fuerza a 0 cuando el total real es positivo -- en una factura de
      // bonificación con Total = 0, una exenta negativa es correcta (compensa la
      // base gravada) y no se debe forzar a cero.
      if(baseExenta<0){ baseGravada = total-iva; baseExenta = 0; }
      else if(Math.abs(baseExenta)<5) baseExenta=0;
    } else if(Math.abs(baseExenta)<5) baseExenta=0;
    return {gravada:baseGravada, exenta:baseExenta};
  }

  var lineas=[];
  if(esVenta){
    var reten = reteIva+reteRenta+reteIca;
    lineas.push({cuenta:"130505", tercero:"", detalle:"Cliente "+tercNombre+" - "+docRef, debito: total-reten, credito:0});
    if(reten>0) lineas.push({cuenta:"135515", tercero:"", detalle:"Retenciones practicadas por "+tercNombre, debito:reten, credito:0});
    var conceptoIngreso = tMatch && INGRESO_LABELS[tMatch.concepto_ingreso];
    if(tMatch && tMatch.concepto_ingreso==="semovientes"){
      lineas.push({cuenta:"413518", tercero:"", detalle:"Venta de animales vivos y cueros "+tercNombre+" - "+docRef, debito:0, credito: total-iva});
    } else if(tMatch && tMatch.concepto_ingreso==="arriendo"){
      lineas.push({cuenta:"424525", tercero:"", detalle:"Ingresos por arrendamientos "+tercNombre+" - "+docRef, debito:0, credito: total-iva});
    } else if(conceptoIngreso){
      lineas.push({cuenta:"429530", tercero:"", detalle:"Ingreso "+conceptoIngreso+" "+tercNombre+" - "+docRef+" (verificar cuenta)", debito:0, credito: total-iva});
    } else {
      var baseV = splitGravadaExenta();
      if(baseV.gravada>0) lineas.push({cuenta:"413501", tercero:"", detalle:"Venta gravada 19% "+docRef, debito:0, credito: baseV.gravada});
      if(baseV.exenta>0) lineas.push({cuenta:"413590", tercero:"", detalle:"Venta exenta/excluida "+docRef, debito:0, credito: baseV.exenta});
      if(baseV.gravada<=0 && baseV.exenta<=0) lineas.push({cuenta:"413590", tercero:"", detalle:"Venta "+docRef, debito:0, credito: total-iva});
    }
    if(iva>0) lineas.push({cuenta:"240801", tercero:"", detalle:"IVA generado", debito:0, credito:iva});
  } else {
    var conceptoGasto = tMatch && CONCEPTO_LABELS[tMatch.concepto_retencion];
    var esMercancia = tMatch && tMatch.tipo==="proveedor" && !conceptoGasto;
    if(esMercancia){
      var baseC = splitGravadaExenta();
      if(baseC.gravada>0) lineas.push({cuenta:"143501", tercero:"", detalle:"Mercancía gravada 19% "+tercNombre+" - "+docRef, debito: baseC.gravada, credito:0});
      if(baseC.exenta>0) lineas.push({cuenta:"143590", tercero:"", detalle:"Mercancía exenta/excluida "+tercNombre+" - "+docRef, debito: baseC.exenta, credito:0});
      else if(baseC.exenta<0) lineas.push({cuenta:"143595", tercero:"", detalle:"Descuento/bonificación del proveedor "+tercNombre+" - "+docRef, debito:0, credito: -baseC.exenta});
      if(baseC.gravada<=0 && baseC.exenta===0) lineas.push({cuenta:"143590", tercero:"", detalle:"Mercancías "+tercNombre+" - "+docRef, debito: total-iva, credito:0});
      if(iva>0) lineas.push({cuenta:"240802", tercero:"", detalle:"IVA descontable", debito:iva, credito:0});
    } else if(tMatch && CONCEPTO_CUENTA_FIJA[tMatch.concepto_retencion]){
      lineas.push({cuenta:CONCEPTO_CUENTA_FIJA[tMatch.concepto_retencion], tercero:"", detalle:conceptoGasto+" "+tercNombre+" - "+docRef+(iva>0?" (IVA incluido como mayor valor)":""), debito: total, credito:0});
    } else if(conceptoGasto){
      lineas.push({cuenta:"519595", tercero:"", detalle:"Gasto "+conceptoGasto+" "+tercNombre+" - "+docRef+" (verificar cuenta)"+(iva>0?" (IVA incluido como mayor valor)":""), debito: total, credito:0});
    } else {
      lineas.push({cuenta:"519595", tercero:"", detalle:"Compra "+tercNombre+" - "+docRef+" (verificar cuenta)"+(iva>0?" (IVA incluido como mayor valor)":""), debito: total, credito:0});
    }
    var pagoProveedor = total-reteIva-reteRenta-reteIca;
    if(esMercancia){
      lineas.push({cuenta:"220501", tercero:"", detalle:"Proveedor "+tercNombre+" - "+docRef, debito:0, credito:pagoProveedor});
    } else {
      lineas.push({cuenta:"110505", tercero:"", detalle:"Caja "+tercNombre+" - "+docRef+" (diverso)", debito:0, credito:pagoProveedor});
    }
    if(reteRenta>0){
      var cuentaRet = !tMatch ? "236595" : (tMatch.concepto_retencion==="compras" ? "236540" : (tMatch.concepto_retencion==="arrendamientos" ? "236575" : "236595"));
      lineas.push({cuenta:cuentaRet, tercero:"", detalle:"Retención en la fuente"+retNota, debito:0, credito:reteRenta});
    }
    if(reteIva>0) lineas.push({cuenta:"236701", tercero:"", detalle:"Reteiva", debito:0, credito:reteIva});
    if(reteIca>0) lineas.push({cuenta:"236801", tercero:"", detalle:"Rete ICA", debito:0, credito:reteIca});
  }

  var porReglas = false;
  if(reglas && reglas.length){
    var documentoKey = esVenta ?
      (esNC ? "Devolucion en Ventas" : ((tMatch && INGRESO_DOC_KEYS[tMatch.concepto_ingreso]) || "Factura de Venta")) :
      (esNC ? "Devolucion en Compras" : ((tMatch && CONCEPTO_DOC_KEYS[tMatch.concepto_retencion]) || "Factura de Compra"));
    var regimenBuscado = tMatch?tMatch.regimen:"";
    var matches = reglas.filter(function(r){ return r.documento===documentoKey; });
    var exact = regimenBuscado ? matches.filter(function(r){ return r.regimen===regimenBuscado; }) : [];
    var aplicables = exact.length ? exact : matches.filter(function(r){ return !r.regimen; });
    var porSlot = {};
    aplicables.forEach(function(r){
      var slot = slotDeCuenta(cod6(r.cuenta_codigo));
      if(slot==="otro") return;
      (porSlot[slot]=porSlot[slot]||[]).push(r);
    });
    Object.keys(porSlot).forEach(function(slot){
      var candidatos = porSlot[slot];
      var elegido = candidatos[0];
      if(candidatos.length>1){
        var esGravada = iva>0;
        var pref = candidatos.find(function(r){
          var n=(r.cuenta_nombre||"").toUpperCase();
          return esGravada ? /GRAVAD/.test(n) : /(EXENT|EXCLUI)/.test(n);
        });
        if(pref) elegido = pref;
      }
      var idx = lineas.findIndex(function(l){ return slotDeCuenta(l.cuenta)===slot; });
      if(idx>=0){
        lineas[idx] = {cuenta:cod6(elegido.cuenta_codigo), tercero:"", detalle:elegido.cuenta_nombre||lineas[idx].detalle, debito:lineas[idx].debito, credito:lineas[idx].credito};
        porReglas = true;
      }
    });
  }

  var esContado = String(row["Forma de Pago"]||"").trim()==="1";
  if(esContado){
    lineas = lineas.map(function(l){
      if(l.cuenta.slice(0,4)==="1305" || l.cuenta.slice(0,4)==="2205"){
        return {cuenta:"110505", tercero:"", detalle:l.detalle+" (contado)", debito:l.debito, credito:l.credito};
      }
      return l;
    });
  }
  if(esNC){
    var remapDevolVenta = {"413501":"417501", "413590":"417590"};
    lineas = lineas.map(function(l){
      var cuenta = (esVenta && remapDevolVenta[l.cuenta]) ? remapDevolVenta[l.cuenta] : l.cuenta;
      return {cuenta:cuenta, tercero:l.tercero, detalle:"(NC) "+l.detalle, debito:l.credito, credito:l.debito};
    });
  }

  var esPersonal = false, esConocidoPersonal = false;
  if(esCompra){
    esConocidoPersonal = !!(tMatch && tMatch.tipo==="personal");
    esPersonal = !esMercancia;
  }
  var etiqueta = esConocidoPersonal ? " [personal]" : (esPersonal ? " [diverso]" : "");

  var lineasAjustadas = balancearAjustePeso(lineas, terceroDeLineas(lineas));
  if(lineasAjustadas) lineas = lineasAjustadas;
  var tot = totalsOf(lineas);
  // Documento Soporte emitido (pagamos un gasto) -> Comprobante de Egreso.
  // Documento Soporte recibido y ya reclasificado como ingreso por arriendo/
  // semovientes -> Nota Contable. Si llega sin reclasificar todavía (tercero
  // sin concepto de ingreso configurado) se deja como Compra, igual que antes,
  // para que se siga viendo como pendiente de revisar.
  var tipoFinal = esDocSoporte ? (empresaEsEmisor ? "CE" : (esVenta ? "NC" : "FC")) : (esVenta? "FV":"FC");
  return {
    tipo: tipoFinal,
    fecha: fecha,
    descripcion: (esNC?"Nota Crédito - ":(esND?"Nota Débito - ":(esVenta?"Venta - ":"Compra - ")))+tercNombre+" ("+docRef+")"+etiqueta,
    lineas: lineas,
    cufe: cufe,
    tercNombre: tercNombre,
    tercIdent: tercIdent,
    tercConocido: !!tMatch,
    total: total,
    iva: iva,
    esVenta: esVenta,
    esNC: esNC,
    esND: esND,
    esPersonal: esPersonal,
    esConocidoPersonal: esConocidoPersonal,
    // Documento soporte que otro emitió a nombre de la empresa: la empresa es la
    // vendedora y esa mercancía ya se facturó (p. ej. a Consumidor Final), así que
    // contabilizarlo la duplicaría. Solo se contabiliza si el tercero es arrendatario
    // o comprador de semovientes (ingreso que no se había facturado).
    dsRecibido: esDocSoporte && !empresaEsEmisor && esCompra,
    porReglas: porReglas,
    debeCuadra: Math.abs(tot.d-tot.c)<1
  };
}
function rebuildVentaMain(r, concepto){
  var total = r.total, iva = Number(r.iva)||0;
  if(concepto==="semovientes") return [{cuenta:"413518", tercero:"", detalle:"Venta de animales vivos y cueros - "+r.tercNombre, debito:0, credito: total-iva}];
  if(concepto==="arriendo") return [{cuenta:"424525", tercero:"", detalle:"Ingresos por arrendamientos - "+r.tercNombre, debito:0, credito: total-iva}];
  var baseGravada = iva>0 ? Math.round(iva/19*100) : 0;
  var baseExenta = total-iva-baseGravada;
  if(baseExenta<0){ baseGravada = total-iva; baseExenta = 0; }
  else if(Math.abs(baseExenta)<5) baseExenta=0;
  var out=[];
  if(baseGravada>0) out.push({cuenta:"413501", tercero:"", detalle:"Venta gravada 19% - "+r.tercNombre, debito:0, credito:baseGravada});
  if(baseExenta>0) out.push({cuenta:"413590", tercero:"", detalle:"Venta exenta/excluida - "+r.tercNombre, debito:0, credito:baseExenta});
  if(!out.length) out.push({cuenta:"413590", tercero:"", detalle:"Venta - "+r.tercNombre, debito:0, credito: total-iva});
  return out;
}
function rebuildDevolucionCompra(r, conRetencion){
  var total = r.total, iva = Number(r.iva)||0;
  var baseGravada = iva>0 ? Math.round(iva/19*100) : 0;
  var baseExenta = total-iva-baseGravada;
  if(baseExenta<0){ baseGravada = total-iva; baseExenta = 0; }
  else if(Math.abs(baseExenta)<5) baseExenta=0;
  var lineas = [];
  if(baseGravada>0) lineas.push({cuenta:"143501", tercero:"", detalle:"(NC) Mercancía gravada 19% "+r.tercNombre, debito:0, credito:baseGravada});
  if(baseExenta>0) lineas.push({cuenta:"143590", tercero:"", detalle:"(NC) Mercancía exenta/excluida "+r.tercNombre, debito:0, credito:baseExenta});
  if(baseGravada<=0 && baseExenta<=0 && total-iva>0) lineas.push({cuenta:"143590", tercero:"", detalle:"(NC) Mercancía "+r.tercNombre, debito:0, credito: total-iva});
  if(iva>0) lineas.push({cuenta:"240802", tercero:"", detalle:"(NC) IVA descontable", debito:0, credito:iva});
  var retAjuste = 0;
  if(conRetencion){
    var tMatch = S.terceros.find(function(t){ return t.identificacion && normNit(t.identificacion)===normNit(r.tercIdent||""); });
    if(!tMatch || (tMatch.concepto_retencion!=="compras" && tMatch.concepto_retencion!=="arrendamientos")){
      alert("Este proveedor no tiene configurado un Concepto de retención (compras/arrendamientos) en Terceros, así que no puedo calcular el ajuste. Configúralo primero si este proveedor sí tiene retención.");
      return null;
    }
    var cfg = S.config || {tasa_compras:2.5, tasa_arrendamientos:3.5};
    var tasa = tMatch.concepto_retencion==="compras" ? cfg.tasa_compras : cfg.tasa_arrendamientos;
    var cuentaRet = tMatch.concepto_retencion==="compras" ? "236540" : "236575";
    var baseRet = total-iva;
    retAjuste = Math.round(baseRet*tasa/100);
    if(retAjuste>0) lineas.push({cuenta:cuentaRet, tercero:"", detalle:"(NC) Ajuste retención en la fuente ("+tasa+"%) - "+r.tercNombre, debito:retAjuste, credito:0});
  }
  lineas.push({cuenta:"220501", tercero:"", detalle:"(NC) Proveedor "+r.tercNombre, debito: total-retAjuste, credito:0});
  return lineas;
}
function extractDocRefFromDescripcion(desc){
  var s = String(desc||"").replace(/\s*\[(personal|diverso)\]\s*$/, "");
  var m = s.match(/\(([^)]*)\)\s*$/);
  return m ? m[1].trim() : "";
}
function buscarFacturaOriginal(docRefBuscado, tercNombre, tercNit){
  var buscadoNorm = String(docRefBuscado||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!buscadoNorm) return null;
  var pool = S.comprobantes.slice();
  (S.importRows||[]).forEach(function(r){
    if(r.dup || r.esNC || r.esVenta || r.tipo!=="FC") return;
    if(/^Nota/.test(r.descripcion||"")) return;
    pool.push({tipo:"FC", descripcion:r.descripcion, lineas:r.lineas, total_debito:totalsOf(r.lineas).d, tercero_nit:normNit(r.tercIdent||""), _delListado:true});
  });
  var nitBuscado = normNit(tercNit||"");
  var mismoTercero = function(c){
    if(nitBuscado && c.tercero_nit) return normNit(c.tercero_nit)===nitBuscado;
    return normNombre(extractTercFromDescripcion(c.descripcion))===normNombre(tercNombre||"");
  };
  var refDe = function(c){ return extractDocRefFromDescripcion(c.descripcion).toUpperCase().replace(/\s+/g,""); };
  var candidatos = pool.filter(function(c){
    if(c.tipo!=="FC") return false;
    if(/^Nota/.test(c.descripcion||"")) return false;
    return refDe(c)===buscadoNorm;
  });
  var tercNorm = normNombre(tercNombre||"");
  if(!candidatos.length && (tercNorm||nitBuscado) && buscadoNorm.length>=3){
    candidatos = pool.filter(function(c){
      if(c.tipo!=="FC" || /^Nota/.test(c.descripcion||"")) return false;
      if(!mismoTercero(c)) return false;
      var ref = refDe(c);
      return ref.length>=3 && (ref.slice(-buscadoNorm.length)===buscadoNorm || buscadoNorm.slice(-ref.length)===ref);
    });
  }
  if(tercNorm||nitBuscado){
    var conTercero = candidatos.filter(mismoTercero);
    if(conTercero.length) candidatos = conTercero;
  }
  if(!candidatos.length) return null;
  if(candidatos.length>1) return {_ambiguo:true, candidatos:candidatos};
  return candidatos[0];
}
function repartirProporcional(lineas, monto, campo){
  var suma = lineas.reduce(function(a,l){ return a+(Number(l[campo])||0); },0);
  var acum = 0;
  return lineas.map(function(l, k){
    var v = (k===lineas.length-1) ? monto-acum : Math.round(monto*(Number(l[campo])||0)/(suma||1));
    acum += v;
    return v;
  });
}
function rebuildDevolucionCalibrada(fo, ncTotal, ncIva, docRef){
  var lins = fo.lineas||[];
  var pref = function(l,p){ return (l.cuenta||"").indexOf(p)===0; };
  var deb = function(l){ return Number(l.debito)||0; }, cre = function(l){ return Number(l.credito)||0; };
  var ivaLins = lins.filter(function(l){ return pref(l,"2408") && deb(l)>0; });
  var merch = lins.filter(function(l){ return deb(l)>0 && !pref(l,"2408"); });
  var rets = lins.filter(function(l){ return cre(l)>0 && (pref(l,"2365")||pref(l,"2367")||pref(l,"2368")); });
  var pagos = lins.filter(function(l){ return cre(l)>0 && !pref(l,"2365") && !pref(l,"2367") && !pref(l,"2368") && !pref(l,"2408") && !pref(l,"4295") && !pref(l,"5305"); });
  if(!ivaLins.length || !merch.length || !pagos.length || ncIva<=0) return null;
  var merchOrig = merch.reduce(function(a,l){ return a+deb(l); },0);
  if(!merchOrig) return null;
  var B = ncTotal - ncIva;
  var G = Math.min(B, Math.round(ncIva/0.19));
  if(Math.abs(B-G)<5) G = B;
  var pre = "(NC ref "+docRef+") ";
  var out = [];
  var grav = merch.filter(function(l){ return pref(l,"143501"); });
  var otros = merch.filter(function(l){ return !pref(l,"143501"); });
  var montos = {};
  if(grav.length){
    repartirProporcional(grav, G, "debito").forEach(function(v,k){ montos["g"+k]=v; });
    if(otros.length) repartirProporcional(otros, B-G, "debito").forEach(function(v,k){ montos["o"+k]=v; });
  } else {
    repartirProporcional(otros, B, "debito").forEach(function(v,k){ montos["o"+k]=v; });
  }
  grav.forEach(function(l,k){ if(montos["g"+k]) out.push({cuenta:l.cuenta, tercero:l.tercero||"", detalle:pre+(l.detalle||""), debito:0, credito:montos["g"+k]}); });
  otros.forEach(function(l,k){ if(montos["o"+k]) out.push({cuenta:l.cuenta, tercero:l.tercero||"", detalle:pre+(l.detalle||""), debito:0, credito:montos["o"+k]}); });
  if(grav.length && !otros.length && B-G>=5) out.push({cuenta:"143590", tercero:"", detalle:pre+"Mercancía exenta/excluida", debito:0, credito:B-G});
  out.push({cuenta:ivaLins[0].cuenta, tercero:ivaLins[0].tercero||"", detalle:pre+(ivaLins[0].detalle||"IVA descontable"), debito:0, credito:ncIva});
  var retTotal = 0;
  rets.forEach(function(l){
    var v = Math.round(cre(l)*B/merchOrig);
    retTotal += v;
    if(v) out.push({cuenta:l.cuenta, tercero:l.tercero||"", detalle:pre+(l.detalle||""), debito:v, credito:0});
  });
  repartirProporcional(pagos, ncTotal-retTotal, "credito").forEach(function(v,k){
    if(v) out.push({cuenta:pagos[k].cuenta, tercero:pagos[k].tercero||"", detalle:pre+(pagos[k].detalle||""), debito:v, credito:0});
  });
  return out;
}
function rebuildDevolucionDesdeFactura(facturaOriginal, ncTotal, docRefBuscado, nc){
  if(nc && Number(nc.iva)>0){
    var calibrada = rebuildDevolucionCalibrada(facturaOriginal, ncTotal, Number(nc.iva), docRefBuscado);
    if(calibrada) return calibrada;
  }
  var totalOriginal = Number(facturaOriginal.total_debito)||0;
  if(!totalOriginal) return null;
  var ratio = Number(ncTotal)/totalOriginal;
  return (facturaOriginal.lineas||[]).map(function(l){
    return {
      cuenta: l.cuenta,
      tercero: l.tercero||"",
      detalle: "(NC ref "+docRefBuscado+") "+(l.detalle||""),
      debito: Math.round((Number(l.credito)||0)*ratio),
      credito: Math.round((Number(l.debito)||0)*ratio)
    };
  });
}
function xmlTag(t, tag){
  var m = t.match(new RegExp("<(?:\\w+:)?"+tag+"(?:\\s[^>]*)?>([^<]*)</(?:\\w+:)?"+tag+">"));
  return m ? m[1].trim() : "";
}
function xmlEnt(x){ return String(x||"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'"); }
function parseNotaCreditoXml(text){
  if(/<(?:\w+:)?AttachedDocument[\s>]/.test(text) && !/<(?:\w+:)?CreditNote[\s>]/.test(text.replace(/<!\[CDATA\[[\s\S]*?\]\]>/g,""))){
    var cd = text.match(/<!\[CDATA\[([\s\S]*?<(?:\w+:)?CreditNote[\s>][\s\S]*?)\]\]>/);
    if(cd) text = cd[1];
  }
  if(!/<(?:\w+:)?CreditNote[\s>]/.test(text)) return null;
  var body = text.replace(/<(?:\w+:)?BillingReference>[\s\S]*?<\/(?:\w+:)?BillingReference>/, "");
  var ref = "";
  var br = text.match(/<(?:\w+:)?BillingReference>([\s\S]*?)<\/(?:\w+:)?BillingReference>/);
  if(br) ref = xmlEnt(xmlTag(br[1], "ID"));
  var dr = text.match(/<(?:\w+:)?DiscrepancyResponse>([\s\S]*?)<\/(?:\w+:)?DiscrepancyResponse>/);
  var notas = [], mn, reNota = /<(?:\w+:)?Note(?:\s[^>]*)?>([^<]*)<\/(?:\w+:)?Note>/g;
  while((mn = reNota.exec(text))) notas.push(xmlEnt(mn[1]));
  var notaTxt = notas.join(" | ");
  var concepto = dr ? xmlEnt(xmlTag(dr[1], "Description")) : "";
  if(!concepto){
    var it = text.match(/<(?:\w+:)?Item>\s*<(?:\w+:)?Description>([^<]*)</);
    if(it) concepto = xmlEnt(it[1]).trim();
  }
  var refIgnorada = "";
  if(ref && /sin\s+factura/i.test(notaTxt)){ refIgnorada = ref; ref = ""; }
  if(!ref){
    var af = notaTxt.match(/afecta\s+factura\s+([A-Za-z0-9\-]+)/i);
    if(af) ref = af[1];
  }
  return {
    id: xmlEnt(xmlTag(body, "ID")),
    cude: xmlTag(body, "UUID"),
    ref: ref,
    refIgnorada: refIgnorada,
    codigo: dr ? xmlTag(dr[1], "ResponseCode") : "",
    concepto: concepto,
    tipoOp: xmlTag(text, "CustomizationID")
  };
}
function leerArchivoComoTexto(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(new Error("No se pudo leer "+file.name)); };
    fr.readAsText(file, "UTF-8");
  });
}
async function extraerXmlsDeArchivos(files){
  var textos = [];
  for(var k=0;k<files.length;k++){
    var f = files[k];
    if(/\.zip$/i.test(f.name)){
      if(typeof JSZip==="undefined") throw new Error("No se cargó el lector de ZIP. Recarga la página (Ctrl+F5) o sube los .xml sueltos.");
      var zip = await JSZip.loadAsync(f);
      var nombres = Object.keys(zip.files).filter(function(n){ return /\.xml$/i.test(n) && !zip.files[n].dir; });
      for(var j=0;j<nombres.length;j++) textos.push(await zip.files[nombres[j]].async("string"));
    } else if(/\.xml$/i.test(f.name)){
      textos.push(await leerArchivoComoTexto(f));
    }
  }
  return textos;
}
function aplicarVinculoNC(i, folio){

  if(!nuevasLineas) return "La factura encontrada no tiene un total válido para calcular la proporción.";
  if(!r._lineasOriginal){ r._lineasOriginal = r.lineas; r._descripcionOriginal = r.descripcion; }
  r.lineas = nuevasLineas;
  r.descripcion = r._descripcionOriginal;
  r.esNCEstado = "vinculada";
  r.ncFacturaRef = folioReal;
  var tot = totalsOf(r.lineas);
  r.debeCuadra = Math.abs(tot.d-tot.c)<1;
  return "";
}
async function cargarXmlNotasCredito(files){
  S.xmlBusy = true; S.xmlResumen = ""; render();
  try{
    var textos = await extraerXmlsDeArchivos(files);
    var vistos = {}, notas = [];
    textos.forEach(function(t){
      var n = parseNotaCreditoXml(t);
      if(!n) return;
      var clave = n.cude || n.id;
      if(vistos[clave]) return;
      vistos[clave] = true; notas.push(n);
    });
    var stats = {vinc:0, dev:0, desc:0, sinRef:0, refNoEnc:0, sinFila:0, ventas:0, manual:0};
    var avisos = [];
    notas.forEach(function(n){
      var idx = -1;
      (S.importRows||[]).forEach(function(r, i){
        if(idx>=0 || !r.esNC) return;
        if((n.cude && r.cufe===n.cude) || (n.id && extractDocRefFromDescripcion(r.descripcion).toUpperCase().replace(/\s+/g,"")===n.id.toUpperCase().replace(/\s+/g,""))) idx = i;
      });
      if(idx<0){ stats.sinFila++; return; }
      var r = S.importRows[idx];
      if(r.esVenta){ stats.ventas++; return; }
      if(r.dup) return;
      var info = [];
      var hecho = false;
      if(/descuento\s+condicionado/i.test(n.concepto)){
        app.marcarDescuentoCondicionado(idx, true); stats.desc++; hecho = true;
        info.push(n.ref ? "XML: afecta la factura "+n.ref : "XML: nota sin factura referenciada");
      } else if(n.ref){
        var err = aplicarVinculoNC(idx, n.ref);
        if(!err){ stats.vinc++; hecho = true; info.push("XML: afecta la factura "+n.ref); }
        else { stats.refNoEnc++; info.push("XML: afecta la factura "+n.ref+" (no está guardada en Cuadre todavía)"); avisos.push(r.tercNombre+" "+n.id+" → factura "+n.ref); }
      } else {
        var errAprox = n.refIgnorada ? aplicarVinculoNC(idx, n.refIgnorada) : "x";
        if(!errAprox){
          stats.vinc++; hecho = true;
          info.push("XML dice \"sin factura\", pero el mismo tercero tiene la factura "+r.ncFacturaRef+" (folio "+n.refIgnorada+"): la vinculé, verifícala");
        } else {
          stats.sinRef++; info.push("XML: nota sin factura referenciada"+(n.refIgnorada?" (la referencia "+n.refIgnorada+" es de relleno: la nota dice \"sin factura\")":""));
        }
      }
      if(!hecho){
        if(/descuento/i.test(n.concepto)){ app.marcarDescuentoCondicionado(idx, true); stats.desc++; hecho = true; }
        else if(n.codigo==="1" || n.codigo==="2" || (!n.ref && !n.codigo)){ app.marcarDevolucionSinRetencion(idx, true); stats.dev++; hecho = true; }
        else stats.manual++;
      }
      if(n.concepto) info.push("concepto: "+n.concepto);
      r.xmlInfo = info.join(" · ");
    });
    var partes = [notas.length+" nota(s) crédito leída(s) del XML."];
    if(stats.vinc) partes.push(stats.vinc+" vinculada(s) a su factura con reverso exacto.");
    if(stats.desc) partes.push(stats.desc+" marcada(s) como descuento condicionado.");
    if(stats.dev) partes.push(stats.dev+" marcada(s) como devolución sin factura.");
    if(stats.refNoEnc) partes.push(stats.refNoEnc+" traen una factura que no encontré en Cuadre (importa primero esa factura y vuelve a cargar el XML): "+avisos.join("; ")+".");
    if(stats.manual) partes.push(stats.manual+" quedaron sin clasificar: elige el tipo a mano.");
    if(stats.sinFila) partes.push(stats.sinFila+" XML no corresponden a ninguna nota de este listado.");
    if(stats.ventas) partes.push(stats.ventas+" son notas de venta (no se modificaron).");
    S.xmlResumen = partes.join(" ");
  }catch(err){
    S.xmlResumen = "No se pudo leer el XML: "+err.message;
  }
  S.xmlBusy = false; render();
}
function handleImportFile(file){

      var seenInFile = {};

      json.forEach(function(row){

        d.dup = !!(d.cufe && (existingCufes[d.cufe] || seenInFile[d.cufe]));
        if(d.cufe) seenInFile[d.cufe]=true;
        d.include = !d.dup && !d.esConocidoPersonal && !d.dsRecibido;
        drafts.push(d);
      });
      S.importRows = drafts;
      S.importFileName = file.name;
      if(!drafts.length && !skippedFecha) S.importErr = "No se encontraron documentos de esta empresa en el archivo. Verifica que el NIT de la empresa esté bien escrito en Cuadre.";
      else if(skippedFecha>0) S.importErr = skippedFecha+" documento(s) no se pudieron importar porque no se entendió su fecha (ejemplo: "+esc(String(sampleFecha))+"). Avísale a Claude este formato para corregirlo.";
    }catch(err){
      S.importErr = "No se pudo leer el archivo: "+err.message;
    }
    S.importBusy=false; render();
  };
  reader.onerror=function(){ S.importErr="No se pudo leer el archivo."; S.importBusy=false; render(); };

}
// La DIAN solo entrega NIT y nombre. Con eso se deduce lo demas: un NIT de
// 9 digitos que empieza por 8 o 9 es una empresa (tipo 31); cualquier otro
// numero es una cedula, o sea persona natural (tipo 13), y su nombre viene
// con los apellidos primero, asi que se separa en apellidos y nombres.
// Una razón social se reconoce por su sigla legal: S.A.S., SAS, S.A., SA,
// LTDA, S en C, & CIA, E.S.P., E.U., en liquidación, sucursal, etc.
function nombreEsDeEmpresa(nombre){
  var s = " " + String(nombre||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/&/g," & ").replace(/[^A-Z0-9&]+/g," ").replace(/\s+/g," ").trim() + " ";
  return / (SAS|S A S|SA|S A|LTDA|LIMITADA|SCA|S C A|S EN C|ESP|E S P|EU|SUCURSAL|LIQUIDACION|COOPERATIVA|FUNDACION|ASOCIACION|CORPORACION) /.test(s) || /( Y | & )CIA /.test(s) || / CIA /.test(s);
}
function datosTerceroDesdeDian(nombre, nit){
  var n = normNit(nit);
  var esEmpresa = nombreEsDeEmpresa(nombre) || (n.length===9 && (n.charAt(0)==="8" || n.charAt(0)==="9"));
  if(esEmpresa) return {es_juridica:true, tipo_documento:"31", razon_social:nombre};
  var p = String(nombre||"").trim().split(/\s+/).filter(Boolean);
  var d = {es_juridica:false, tipo_documento:"13", razon_social:""};
  if(p.length>=4){ d.primer_apellido=p[0]; d.segundo_apellido=p[1]; d.primer_nombre=p[2]; d.otros_nombres=p.slice(3).join(" "); }
  else if(p.length===3){ d.primer_apellido=p[0]; d.segundo_apellido=p[1]; d.primer_nombre=p[2]; }
  else if(p.length===2){ d.primer_apellido=p[0]; d.primer_nombre=p[1]; }
  else if(p.length===1){ d.primer_nombre=p[0]; }
  return d;
}
async function confirmImport(){
  if(S.importBusy) return; // ya hay una importación en curso: no se permite iniciar otra
  var rows = (S.importRows||[]).filter(function(r){return r.include && r.debeCuadra;});
  if(!rows.length){ alert("No hay filas seleccionadas para importar."); return; }
  var invalidas = rows.filter(function(r){ return !validarSubcuentas(r.lineas); });
  if(invalidas.length){
    alert(ERROR_SUBCUENTA_INVALIDA+"\n\nEsto pasó en "+invalidas.length+" documento(s) — probablemente por una regla de cuentas configurada con un código de 4 dígitos en vez de 6. Corrige esa regla en \"Reglas de cuentas\" antes de continuar:\n"+
      invalidas.slice(0,15).map(function(r){return "- "+r.tercNombre+" ("+r.fecha+")";}).join("\n")+(invalidas.length>15?"\n...":""));
    return;
  }
  S.importBusy=true; render();

  var nuevosMap = {};
  rows.forEach(function(r){
    if(r.tercConocido || !r.tercIdent) return;
    var key = normNit(r.tercIdent);
    if(!key || nuevosMap[key]) return;
    nuevosMap[key] = Object.assign({empresa_id:S.empresaId, nombre:r.tercNombre, identificacion:r.tercIdent, tipo:(r.esVenta?"cliente":"otro"), pais:"Colombia"},
      datosTerceroDesdeDian(r.tercNombre, r.tercIdent));
  });
  var nuevos = Object.keys(nuevosMap).map(function(k){return nuevosMap[k];});
  var nuevosClientes=0, nuevosOtros=0;
  if(nuevos.length){
    var resT = await sb.from("terceros").insert(nuevos).select();
    if(resT.error){
      alert("No se pudieron registrar automáticamente los terceros nuevos: "+resT.error.message+". Se importarán los comprobantes igual, pero revisa Terceros después.");
    } else {
      (resT.data||[]).forEach(function(t){ S.terceros.push(t); if(t.tipo==="cliente") nuevosClientes++; else nuevosOtros++; });
    }
  }

  var counters={};
  function nextNum(tipo,periodo){
    var key=tipo+"|"+periodo;
    if(counters[key]==null){
      var max=0;
      S.comprobantes.forEach(function(c){ if(c.tipo===tipo && c.periodo===periodo){ var n=parseInt((c._id||"").split("-").pop(),10); if(n>max) max=n; } });
      counters[key]=max;
    }
    counters[key]++;
    return tipo+"-"+periodo+"-"+String(counters[key]).padStart(4,"0");
  }
  var toInsert = rows.map(function(r){
    var periodo = r.fecha.slice(0,7);
    var numero = nextNum(r.tipo, periodo);
    var tot = totalsOf(r.lineas);
    return {empresa_id:S.empresaId, numero:numero, tipo:r.tipo, fecha:r.fecha, periodo:periodo, descripcion:r.descripcion, lineas:r.lineas, total_debito:tot.d, total_credito:tot.c, estado:"contabilizado", cufe:r.cufe||null, tercero_nit:normNit(r.tercIdent||"")||null};
  });
  var CHUNK=500, done=0;
  for(var i=0;i<toInsert.length;i+=CHUNK){
    var batch = toInsert.slice(i, i+CHUNK);
    var res = await sb.from("comprobantes").upsert(batch, {onConflict:"empresa_id,cufe", ignoreDuplicates:true});
    if(res.error){
      S.importBusy=false; render();
      alert("Se importaron "+done+" de "+toInsert.length+" antes de un error: "+res.error.message+". Los ya importados quedaron guardados; puedes reintentar con el resto más tarde.");
      return;
    }
    batch.forEach(function(row){ var r=Object.assign({},row); r._id=r.numero; S.comprobantes.push(r); });
    done += batch.length;
    S.importProgress = {done:done, total:toInsert.length};
    render();
  }
  S.importBusy=false; S.importProgress=null;
  var n=toInsert.length;
  S.importRows=null; S.importFileName="";
  render();
  var msg = "Se importaron "+n+" comprobantes.";
  if(nuevosClientes||nuevosOtros) msg += " Se registraron "+(nuevosClientes+nuevosOtros)+" terceros nuevos en Terceros ("+nuevosClientes+" como Cliente, "+nuevosOtros+" como Otro/Diversos) — revísalos y reclasifícalos si hace falta.";
  msg += " Revísalos en la pestaña Comprobantes (las compras traen una cuenta de gasto genérica que puedes reclasificar).";
  alert(msg);
}

/* ---------- limpieza de compras ya importadas ---------- */
function extractTercFromDescripcion(desc){
  var s = String(desc||"");
  s = s.replace(/^(Compra|Venta|Nota Crédito|Nota Débito) - /, "");
  s = s.replace(/\s*\[(personal|diverso)\]\s*$/, "");
  s = s.replace(/\s*\([^)]*\)\s*$/, "");
  return s.trim();
}
function normNombre(s){
  return String(s||"").trim().toUpperCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\./g,"").replace(/[^A-Z0-9]+/g," ").trim()
    .split(" ").filter(function(t){ return t.length>1 && ["SA","SAS","LTDA","CIA","SCA","ENC","EU"].indexOf(t)<0; })
    .sort().join(" ");
}
// Tercero de un comprobante: primero por NIT guardado (no cambia nunca);
// solo si el comprobante no lo tiene se usa el nombre como respaldo.
var _idxNit = {arr:null, len:-1, map:{}, sello:""};
function terceroDeComprobante(c){
  var nit = normNit(c.tercero_nit||"");
  if(nit){
    var sello = S.terceros.length ? (S.terceros[0].identificacion||"")+"|"+(S.terceros[S.terceros.length-1].identificacion||"") : "";
    if(_idxNit.arr!==S.terceros || _idxNit.len!==S.terceros.length || _idxNit.sello!==sello){
      var map = {};
      S.terceros.forEach(function(t){
        var n = normNit(t.identificacion);
        if(!n) return;
        if(!map[n] || (t.tipo && t.tipo!=="cliente" && t.tipo!=="otro" && (!map[n].tipo || map[n].tipo==="cliente" || map[n].tipo==="otro"))) map[n] = t;
      });
      _idxNit = {arr:S.terceros, len:S.terceros.length, map:map, sello:sello};
    }
    if(_idxNit.map[nit]) return _idxNit.map[nit];
  }
  return terceroPorNombre(extractTercFromDescripcion(c.descripcion));
}
function gruposTercerosPorNit(){
  var byNit = {};
  S.terceros.forEach(function(t){
    var nit = normNit(t.identificacion);
    if(!nit) return;
    if(!byNit[nit]) byNit[nit] = [];
    byNit[nit].push(t);
  });
  return Object.keys(byNit).map(function(nit){
    var terceros = byNit[nit];
    var preferido = terceros.find(function(t){ return t.tipo && t.tipo!=="cliente" && t.tipo!=="otro"; }) || terceros[0];
    var variantes = {};
    terceros.forEach(function(t){
      if(t.nombre) variantes[normNombre(t.nombre)] = true;
      if(t.nombre_comercial) variantes[normNombre(t.nombre_comercial)] = true;
    });
    return {nit:nit, terceros:terceros, label:preferido.nombre, variantes:Object.keys(variantes)};
  });
}
function grupoTerceroDeNit(nit){
  if(!nit) return null;
  return gruposTercerosPorNit().find(function(g){ return g.nit===nit; }) || null;
}
function terceroPorNombre(nombre){
  if(!nombre) return null;
  var norm = normNombre(nombre);
  if(!norm) return null;
  var sello = S.terceros.length ? (S.terceros[0].nombre||"")+"|"+(S.terceros[S.terceros.length-1].nombre||"") : "";
  if(_idxNombre.arr!==S.terceros || _idxNombre.len!==S.terceros.length || _idxNombre.sello!==sello){
    var mp = {}, mc = {};
    S.terceros.forEach(function(t){
      var a = normNombre(t.nombre); if(a && !mp[a]) mp[a] = t;
      var b = normNombre(t.nombre_comercial); if(b && !mc[b]) mc[b] = t;
    });
    _idxNombre = {arr:S.terceros, len:S.terceros.length, sello:sello, porNombre:mp, porComercial:mc};
  }
  return _idxNombre.porNombre[norm] || _idxNombre.porComercial[norm] || null;
}
var _idxNombre = {arr:null, len:-1, sello:"", porNombre:{}, porComercial:{}};
function analizarDocSoporte(){
  var grupos = gruposTercerosPorNit();
  var nitCompraConfig = {};
  grupos.forEach(function(g){
    var tieneCompra = g.terceros.some(function(t){ return !!(t.concepto_retencion||"").trim(); });
    if(tieneCompra) nitCompraConfig[g.nit] = g;
  });
  var candidatos = [];
  S.comprobantes.forEach(function(c){

      var conceptos = grupo.terceros.filter(function(t){return t.concepto_retencion;}).map(function(t){return CONCEPTO_LABELS[t.concepto_retencion]||t.concepto_retencion;}).join(", ");
      candidatos.push({id:c._id, periodo:c.periodo, descripcion:c.descripcion, total:c.total_debito, nit:grupo.nit, tercero:grupo.label, conceptos:conceptos});
    }
  });
  S.docSoporteCandidatos = candidatos;
  render();
}
function analizarCompras(){

/* ---------- saldos engine ---------- */
function computeSaldos(hastaPeriodo){
  var saldos={};
  S.cuentas.forEach(function(c){ saldos[c.codigo]={d:0,c:0}; });
  S.comprobantes.forEach(function(cp){
    if(!cp.periodo || cp.periodo>hastaPeriodo) return;
    if(cp.periodo.slice(0,4)!==hastaPeriodo.slice(0,4)) return;
    (cp.lineas||[]).forEach(function(l){
      if(!saldos[l.cuenta]) saldos[l.cuenta]={d:0,c:0};
      saldos[l.cuenta].d += Number(l.debito)||0;
      saldos[l.cuenta].c += Number(l.credito)||0;
    });
  });
  return saldos;
}
function movimientosPeriodo(periodo){
  var mov={};
  S.cuentas.forEach(function(c){ mov[c.codigo]={d:0,c:0}; });
  S.comprobantes.forEach(function(cp){
    if(cp.periodo!==periodo) return;
    (cp.lineas||[]).forEach(function(l){
      if(!mov[l.cuenta]) mov[l.cuenta]={d:0,c:0};
      mov[l.cuenta].d += Number(l.debito)||0;
      mov[l.cuenta].c += Number(l.credito)||0;
    });
  });
  return mov;
}
function saldoNeto(codigo, sums){
  var s=sums[codigo]||{d:0,c:0};
  var ac=cuentaByCodigo(codigo);
  var nat = ac?ac.naturaleza:"debito";
  return nat==="debito" ? (s.d-s.c) : (s.c-s.d);
}
function utilidadAcumulada(hastaPeriodo){
  var sums=computeSaldos(hastaPeriodo);
  var ing=0,gas=0,cos=0;
  S.cuentas.forEach(function(c){
    if(!esPostable(c.codigo)) return;
    var n=saldoNeto(c.codigo,sums);
    if(c.tipo==="ingreso") ing+=n;
    else if(c.tipo==="gasto") gas+=n;
    else if(c.tipo==="costo") cos+=n;
  });
  return {ingresos:ing, gastos:gas, costos:cos, utilidad: ing-gas-cos};
}

  modalHTML=""; render();

function refreshTotalsBar(){
  var tot=totalsOf(draftLineas), diff=tot.d-tot.c;
  var td=document.getElementById("v-totd"), tc=document.getElementById("v-totc"), df=document.getElementById("v-diff"), box=document.getElementById("v-diffbox"), btn=document.getElementById("v-savebtn");
  if(!td) return;
  td.textContent=fmtCOP(tot.d); tc.textContent=fmtCOP(tot.c); df.textContent=fmtCOP(diff);
  var exacto = Math.abs(diff)<0.5 && tot.d>0;
  var ajustable = !exacto && Math.abs(diff)<=TOLERANCIA_AJUSTE_PESO && tot.d>0;
  box.className = exacto?"diff-ok":(ajustable?"diff-adjust":"diff-off");
  if(btn){ if(exacto||ajustable) btn.removeAttribute("disabled"); else btn.setAttribute("disabled","disabled"); }
}

function render(){
  var root=document.getElementById("root");
  if(!S.authChecked){
    root.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spin"></div>Cargando Cuadre…</div>';
    return;
  }
  if(!S.session){
    root.innerHTML = loginScreen();
    var f = document.getElementById("login-form");
    if(f) f.addEventListener("submit", function(ev){
      ev.preventDefault();
      doLogin(document.getElementById("li-email").value.trim(), document.getElementById("li-pass").value);
    });
    return;
  }
  var activeEl = document.activeElement;
  var activeId = activeEl && activeEl.id;
  var selStart, selEnd;
  if(activeId && (activeEl.tagName==="INPUT"||activeEl.tagName==="TEXTAREA")){
    selStart = activeEl.selectionStart; selEnd = activeEl.selectionEnd;
  }
  root.innerHTML = sidebarHTML() + mainHTML() + (modalHTML||"");
  if(activeId){
    var again = document.getElementById(activeId);
    if(again && (again.tagName==="INPUT"||again.tagName==="TEXTAREA")){
      again.focus();
      if(selStart!=null && again.setSelectionRange){ try{ again.setSelectionRange(selStart, selEnd); }catch(err){} }
    }
  }
}

function dashboardHTML(e){
  var per = S.periodo || todayPeriodo();
  var util = utilidadAcumulada(per);
  var sums = computeSaldos(per);
  var activos=0,pasivos=0,patrimonioBase=0;
  S.cuentas.forEach(function(c){
    if(!esPostable(c.codigo)) return;
    var n=saldoNeto(c.codigo,sums);
    if(c.tipo==="activo") activos+=n;
    else if(c.tipo==="pasivo") pasivos+=n;
    else if(c.tipo==="patrimonio") patrimonioBase+=n;
  });
  var patrimonio = patrimonioBase+util.utilidad;
  var voucherPeriodo = S.comprobantes.filter(function(c){return c.periodo===per;});
  var td=0,tc=0;
  voucherPeriodo.forEach(function(v){ td+=v.total_debito||0; tc+=v.total_credito||0; });
  var cuadra = Math.abs(td-tc)<1;
  var cerrado = periodoCerrado(per);

  var kpis = [
    ["Total activos", fmtCOP(activos), "al cierre de "+periodoLabel(per)],
    ["Total pasivos", fmtCOP(pasivos), ""],
    ["Patrimonio", fmtCOP(patrimonio), "incluye utilidad acumulada"],
    ["Utilidad del ejercicio", fmtCOP(util.utilidad), "acumulado del año a "+periodoLabel(per)]
  ];
  var kpiHTML = kpis.map(function(k){return '<div class="card kpi"><div class="lbl">'+k[0]+'</div><div class="val">'+k[1]+'</div><div class="foot">'+k[2]+'</div></div>';}).join("");

  var recientes = S.comprobantes.slice().sort(function(a,b){return (b._id||"").localeCompare(a._id||"");}).slice(0,6);
  var recRows = recientes.map(function(c){
    return '<tr><td class="mono acct-code">'+c._id+'</td><td>'+fmtDate(c.fecha)+'</td><td>'+esc(c.descripcion)+'</td><td class="num">'+fmtCOP(c.total_debito)+'</td></tr>';
  }).join("") || '<tr><td colspan="4" class="small" style="padding:16px 10px">Aún no hay comprobantes en esta empresa.</td></tr>';

  return topbarHTML() +
  '<div class="kpi-grid">'+kpiHTML+'</div>' +
  '<div class="grid-2">' +
    '<div class="card card-pad">' +
      '<div class="section-title">Comprobantes recientes</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th>No.</th><th>Fecha</th><th>Descripción</th><th class="num">Valor</th></tr></thead><tbody>'+recRows+'</tbody></table></div>' +
    '</div>' +
    '<div class="card card-pad">' +
      '<div class="section-title">Estado del periodo</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
        '<div>'+(cerrado?'<span class="chip chip-good"><span class="chip-dot"></span>Periodo cerrado</span>':'<span class="chip chip-warn"><span class="chip-dot"></span>Periodo abierto</span>')+'</div>' +
        '<div>'+(cuadra?'<span class="chip chip-good"><span class="chip-dot"></span>Débitos y créditos cuadran</span>':'<span class="chip chip-bad"><span class="chip-dot"></span>Descuadre: '+fmtCOP(td-tc)+'</span>')+'</div>' +
        '<div class="small">'+voucherPeriodo.length+' comprobante(s) en '+periodoLabel(per)+'</div>' +
        '<a class="link" onclick="app.setTab(\'periodos\')" style="font-size:12.5px">Ir a Periodos →</a>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : ""; }

function retencionLabel(t){
  var out = "";
  if(t.autorretenedor) out = '<span class="chip chip-good"><span class="chip-dot"></span>Sin retención (O-15/O-47)</span>';
  else if(t.concepto_retencion==="compras") out = '<span class="chip chip-warn">Compras 2.5%</span>';
  else if(t.concepto_retencion==="arrendamientos") out = '<span class="chip chip-warn">Arrendamientos 3.5%</span>';
  else if(CONCEPTO_LABELS[t.concepto_retencion]) out = '<span class="chip">'+esc(CONCEPTO_LABELS[t.concepto_retencion])+' (sin retención)</span>';
  if(INGRESO_LABELS[t.concepto_ingreso]) out += ' <span class="chip chip-good">'+esc(INGRESO_LABELS[t.concepto_ingreso])+'</span>';
  if(!out && (t.tipo==="proveedor" || t.tipo==="otro")) return '<span class="chip chip-bad">Retención sin definir</span>';
  return out || '<span class="small">—</span>';
}

function categoriaComprobante(c){
  var desc = c.descripcion||"";
  if(/^Descuento Condicionado/.test(desc)) return "dc";
  if(/^Nota Crédito/.test(desc)) return "nc";
  if(/^Nota Débito/.test(desc)) return "nd";
  if(c.tipo==="NM") return "nomina";
  if(c.tipo==="FV") return "fv";
  if(c.tipo==="FC"){
    var esMercancia = (c.lineas||[]).some(function(l){ return (l.cuenta||"").slice(0,2)==="14"; });
    return esMercancia ? "fc" : "gastos";
  }
  return "otro";
}
var CATEGORIAS_COMPROBANTE = [
  ["","Todos"],["fv","Factura de Venta"],["fc","Factura de Compra"],["gastos","Gastos"],
  ["nomina","Nóminas"],["nc","Notas Crédito"],["nd","Notas Débito"],["dc","Descuentos Condicionados"],["otro","Otros"]
];
function comprobantesFiltrados(){
  var q = (S.compBuscar||"").trim().toLowerCase();
  var grupo = S.compTerceroId ? grupoTerceroDeNit(S.compTerceroId) : null;
  var cuenta = (S.compCuenta||"").trim().replace(/\D/g,"");
  if(q || grupo || cuenta){
    return S.comprobantes.filter(function(c){
      if(q && !((c._id||"").toLowerCase().indexOf(q)>=0 || (c.descripcion||"").toLowerCase().indexOf(q)>=0)) return false;
      if(grupo){
        if(c.tercero_nit){
          if(normNit(c.tercero_nit)!==grupo.nit) return false;
        } else {
          var nombreDoc = normNombre(extractTercFromDescripcion(c.descripcion));
          if(!nombreDoc || grupo.variantes.indexOf(nombreDoc)<0) return false;
        }
      }
      if(cuenta && !(c.lineas||[]).some(function(l){ return (l.cuenta||"").indexOf(cuenta)===0; })) return false;
      return true;
    }).sort(function(a,b){ return (b.periodo+b._id).localeCompare(a.periodo+a._id); });
  }
  var per = S.periodo || todayPeriodo();
  var listPeriodo = S.comprobantes.filter(function(c){return c.periodo===per;});
  return (S.compFiltro ? listPeriodo.filter(function(c){return categoriaComprobante(c)===S.compFiltro;}) : listPeriodo)
    .slice().sort(function(a,b){return (a._id||"").localeCompare(b._id||"");});
}
function exportarComprobantes(lista){

  }));
  var detHeaders = ["Número comprobante","Cuenta","Nombre cuenta","Detalle","Débito","Crédito"];

function comprobanteMensualHTML(per){
  var list = S.comprobantes.filter(function(c){return c.periodo===per;});
  if(!list.length) return '<div class="card card-pad"><p class="small">Sin comprobantes en '+periodoLabel(per)+'.</p></div>';
  var BLOQUE_LABELS = {
    FV:"Ventas", FV_NC:"Devoluciones en Ventas", FV_ARR:"Ingresos por Arrendamiento", FV_SEMOV:"Venta de Semovientes",
    FC:"Compras", FC_NC:"Devoluciones en Compras", FC_GASTO:"Gastos",
    DC:"Descuentos Comerciales Condicionados", CV:"Costo de Venta"
  };
  var bloques={};
  // Cada línea se registra tal cual quedó guardada -- desde que todas las
  // compras/ventas de mercancía se contabilizan siempre con su gravada,
  // exenta y descuento (si aplica) ya separados en líneas propias, no hace
  // falta reconstruir nada a partir del IVA/total del documento: eso solo
  // servía para documentos viejos sin ese desglose, y esa reconstrucción
  // agregada era justamente lo que escondía el crédito de una bonificación
  // dentro del neto de otros documentos exentos del mismo mes.
  list.forEach(function(c){
    var desc = c.descripcion||"";
    var esDevol = /^Nota Crédito/.test(desc);
    var esDC = /^Descuento Condicionado/.test(desc);
    var key;
    var esIngresoEspecial = (c.lineas||[]).some(function(l){return l.cuenta==="424525"||l.cuenta==="413518";});
    if(esDC) key="DC";
    else if(c.tipo==="FV" || (c.tipo==="NC" && esIngresoEspecial)){
      if(esDevol) key="FV_NC";
      else{
        var esArriendo = (c.lineas||[]).some(function(l){return l.cuenta==="424525";});
        var esSemov = (c.lineas||[]).some(function(l){return l.cuenta==="413518";});
        key = esArriendo?"FV_ARR":(esSemov?"FV_SEMOV":"FV");
      }
    } else if(c.tipo==="FC" || c.tipo==="CE"){
      if(esDevol) key="FC_NC";
      else{
        var esMercancia = (c.lineas||[]).some(function(l){return (l.cuenta||"").slice(0,2)==="14";});
        key = esMercancia?"FC":"FC_GASTO";
      }
    } else key = c.tipo;
    if(!bloques[key]) bloques[key]={};
    (c.lineas||[]).forEach(function(l){
      var cuenta = l.cuenta||"";
      if(!bloques[key][cuenta]) bloques[key][cuenta]={d:0,c:0};
      bloques[key][cuenta].d += Number(l.debito)||0;
      bloques[key][cuenta].c += Number(l.credito)||0;
    });
  });
  var orden = ["FV","FV_NC","FC","FC_NC","DC","CV","FC_GASTO","FV_ARR","FV_SEMOV","RC","CE","NC","NM"];
  var claves = Object.keys(bloques).sort(function(a,b){
    var ia=orden.indexOf(a), ib=orden.indexOf(b);
    if(ia<0) ia=99; if(ib<0) ib=99;
    return ia-ib;
  });
  var totD=0, totC=0;
  var html = '<div class="card card-pad"><div class="section-title">Comprobante consolidado — '+periodoLabel(per)+'</div>';
  claves.forEach(function(k){
    var tipoLbl = BLOQUE_LABELS[k] || (COMPROB_TIPOS.find(function(t){return t.k===k;})||{}).label || k;
    var items = Object.keys(bloques[k]).map(function(cod){
      var s = bloques[k][cod];
      var ac = cuentaByCodigo(cod);
      return {codigo:cod, nombre:ac?ac.nombre:"", d:s.d, c:s.c};
    });
    var grupos = agruparPorMayor(items, ["d","c"]);
    var subD=0, subC=0;
    var filas = Object.keys(grupos).sort().map(function(mayor){
      var g = grupos[mayor];
      subD+=g.d; subC+=g.c;
      var fila = '<tr><td class="mono acct-code">'+mayor+'</td><td>'+esc(g.nombre)+'</td><td class="num">'+(g.d?fmtCOP(g.d):"")+'</td><td class="num">'+(g.c?fmtCOP(g.c):"")+'</td></tr>';
      g.subs.forEach(function(s){
        fila += '<tr class="small" style="opacity:.7"><td class="mono acct-code" style="padding-left:22px">'+s.codigo+'</td><td>'+esc(s.nombre)+'</td><td class="num">'+(s.d?fmtCOP(s.d):"")+'</td><td class="num">'+(s.c?fmtCOP(s.c):"")+'</td></tr>';
      });
      return fila;
    }).join("");
    totD+=subD; totC+=subC;
    html += '<div class="small" style="font-weight:600;margin:16px 0 6px">'+tipoLbl+'</div>' +
      '<div class="table-wrap"><table class="data"><thead><tr><th>Cuenta</th><th>Nombre</th><th class="num">Débito</th><th class="num">Crédito</th></tr></thead><tbody>'+filas+
      '<tr class="total-row"><td colspan="2">Subtotal</td><td class="num">'+fmtCOP(subD)+'</td><td class="num">'+fmtCOP(subC)+'</td></tr></tbody></table></div>';
  });
  var cuadra = Math.abs(totD-totC)<1;
  html += '<div class="kpi-grid" style="margin-top:18px">' +
    '<div class="card kpi"><div class="lbl">Total débito</div><div class="val">'+fmtCOP(totD)+'</div></div>' +
    '<div class="card kpi"><div class="lbl">Total crédito</div><div class="val">'+fmtCOP(totC)+'</div></div>' +
    '<div class="card kpi"><div class="lbl">Cuadre</div><div class="val">'+(cuadra?'<span class="chip chip-good"><span class="chip-dot"></span>Cuadra</span>':'<span class="chip chip-bad"><span class="chip-dot"></span>No cuadra</span>')+'</div></div>' +
  '</div></div>';
  return html;
}
